<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập — Online Recruitment</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; padding: 40px; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08); width: 400px; }
        h2 { margin-bottom: 8px; color: #1a2b4a; }
        .sub { color: #6b7a90; margin-bottom: 24px; font-size: 14px; }
        label { display: block; margin: 14px 0 6px; font-size: 14px; color: #333; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #ccd4e0; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #2a6df4; }
        button { width: 100%; padding: 12px; margin-top: 24px; background: #2a6df4; color: #fff;
            border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d5ad6; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .error { background: #fdeaea; color: #b72020; }
        .success { background: #e6f7e6; color: #1f6f1f; }
        .box { margin-top: 24px; padding: 14px; background: #f7f9fc; border-radius: 8px;
            font-size: 13px; color: #4a5568; line-height: 1.7; }
        .box b { color: #1a2b4a; }
        .back { display: inline-block; margin-top: 16px; font-size: 13px; color: #6b7a90; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h2>Đăng nhập</h2>
    <p class="sub">Online Recruitment System</p>

    <div class="msg error" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu!</div>
    <div class="msg success" th:if="${param.logout}">Bạn đã đăng xuất thành công.</div>

    <form th:action="@{/login}" method="post">
        <label>Tên đăng nhập</label>
        <input type="text" name="username" required autofocus>

        <label>Mật khẩu</label>
        <input type="password" name="password" required>

        <button type="submit">Đăng nhập</button>
    </form>

    <div class="box">
        <b>Tài khoản test:</b><br>
        admin01 / admin123 (Quản trị)<br>
        recruiter01 / recruiter123 (Nhà tuyển dụng)<br>
        candidate01 / candidate123 (Ứng viên)
    </div>

    <a class="back" th:href="@{/}">← Về trang chủ</a>
</div>
</body>
</html>
