<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản Ứng viên | OnlineRecruitment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-center items-center py-12 px-4 sm:px-6 antialiased">

<!-- Logo Brand -->
<div class="mb-8 text-center">
    <a th:href="@{/}" class="inline-flex items-center gap-2.5">
        <span class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black text-white text-lg shadow-md shadow-blue-500/25">OR</span>
        <span class="font-display font-black text-2xl text-slate-900 tracking-tight">OnlineRecruitment</span>
    </a>
</div>

<!-- Card Container -->
<div class="w-full max-w-2xl bg-white rounded-3xl p-8 sm:p-10 border border-slate-200/80 shadow-xl shadow-slate-200/50">
    <div class="text-center mb-8">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-bold uppercase tracking-wider mb-2">
            <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Dành Cho Ứng Viên
        </span>
        <h1 class="text-2xl sm:text-3xl font-display font-extrabold text-slate-900 tracking-tight">
            Tạo Tài Khoản Mới
        </h1>
        <p class="text-sm text-slate-500 mt-1.5">
            Bắt đầu hành trình tìm kiếm công việc mơ ước và phát triển sự nghiệp
        </p>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}"
         class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-medium flex items-center gap-3">
        <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 shrink-0"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Registration Form -->
    <form th:action="@{/register/candidate}" th:object="${candidateDto}" method="post" class="space-y-5">

        <!-- Username & Full Name -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Tên người dùng <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i data-lucide="at-sign" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="username" th:field="*{username}"
                           placeholder="nguyenvana"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('username')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                </div>
                <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div>
                <label for="fullName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Họ và tên <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="fullName" th:field="*{fullName}"
                           placeholder="Nguyễn Văn A"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                </div>
                <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
            </div>
        </div>

        <!-- Email -->
        <div>
            <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Địa chỉ Email <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
                <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="example@gmail.com"
                       class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                       th:classappend="${#fields.hasErrors('email')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
            </div>
            <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <!-- Password & Confirm Password -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Mật khẩu <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="password" id="password" th:field="*{password}"
                           placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('password')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                </div>
                <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Xác nhận mật khẩu <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i data-lucide="shield-check" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                </div>
                <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
            </div>
        </div>

        <!-- Phone & DOB -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="phone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Số điện thoại <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="phone" th:field="*{phone}"
                           placeholder="0912345678"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('phone')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                </div>
                <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
            </div>

            <div>
                <label for="dob" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Ngày sinh <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <input type="date" id="dob" th:field="*{dob}"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('dob')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                </div>
                <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></p>
            </div>
        </div>

        <!-- Gender -->
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                Giới tính <span class="text-rose-500">*</span>
            </label>
            <div class="flex items-center gap-6">
                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                    <input type="radio" th:field="*{gender}" value="Male" checked
                           class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
                    <span>Nam</span>
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                    <input type="radio" th:field="*{gender}" value="Female"
                           class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
                    <span>Nữ</span>
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                    <input type="radio" th:field="*{gender}" value="Other"
                           class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
                    <span>Khác</span>
                </label>
            </div>
            <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p>
        </div>

        <!-- Address -->
        <div>
            <label for="address" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Địa chỉ hiện tại <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
                <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="address" th:field="*{address}"
                       placeholder="Quận/Huyện, Tỉnh/Thành phố"
                       class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                       th:classappend="${#fields.hasErrors('address')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
            </div>
            <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
        </div>

        <!-- Submit Button -->
        <button type="submit"
                class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-600/30 transition-all flex items-center justify-center gap-2 mt-6">
            <i data-lucide="user-check" class="w-4 h-4"></i>
            <span>Đăng Ký Tài Khoản</span>
        </button>

        <!-- Footer link -->
        <div class="text-center text-xs text-slate-500 pt-4 border-t border-slate-100">
            Đã có tài khoản?
            <a th:href="@{/login}" class="text-blue-600 font-bold hover:underline ml-1">Đăng nhập ngay</a>
        </div>
    </form>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
