<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản Nhà Tuyển Dụng | OnlineRecruitment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/ui-polish.css}">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-center items-center py-12 px-4 sm:px-6 antialiased">

<!-- Logo Brand -->
<div class="mb-8 text-center">
    <a th:href="@{/}" class="inline-flex items-center gap-2.5">
        <span class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black text-white text-lg shadow-md shadow-blue-500/25">
            <i data-lucide="briefcase" class="w-5 h-5"></i>
        </span>
        <span class="font-display font-black text-2xl text-slate-900 tracking-tight">JOB<span class="text-blue-600">PORTAL</span></span>
    </a>
</div>

<!-- Card Container -->
<div class="w-full max-w-3xl bg-white rounded-3xl p-8 sm:p-10 border border-slate-200/80 shadow-xl shadow-slate-200/50">
    <div class="text-center mb-8">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-bold uppercase tracking-wider mb-2">
            <i data-lucide="building-2" class="w-3.5 h-3.5"></i> Dành Cho Doanh Nghiệp & HR
        </span>
        <h1 class="text-2xl sm:text-3xl font-display font-extrabold text-slate-900 tracking-tight">
            Đăng Ký Tài Khoản Tuyển Dụng
        </h1>
        <p class="text-sm text-slate-500 mt-1.5">
            Tiếp cận hàng triệu ứng viên chất lượng cao và xây dựng thương hiệu tuyển dụng vững mạnh
        </p>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}"
         class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-medium flex items-center gap-3">
        <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 shrink-0"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Form -->
    <form th:action="@{/register/recruiter}" th:object="${recruiterDto}" method="post" class="space-y-8">

        <!-- SECTION 1: NGƯỜI ĐẠI DIỆN -->
        <div class="space-y-4">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-100">
                <i data-lucide="user-check" class="w-4 h-4 text-blue-600"></i>
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-900">1. Thông Tin Người Đại Diện</h2>
            </div>

            <!-- Username & Email -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Tên người dùng <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="username" th:field="*{username}"
                           placeholder="nguyenvanrecruiter"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('username')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>

                <div>
                    <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Email đăng nhập <span class="text-rose-500">*</span>
                    </label>
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="recruiter@company.com"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('email')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
            </div>

            <!-- Full Name & Phone -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="fullName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Họ và tên người đại diện <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="fullName" th:field="*{fullName}"
                           placeholder="Nguyễn Văn A"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                </div>

                <div>
                    <label for="phone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Số điện thoại liên hệ
                    </label>
                    <input type="text" id="phone" th:field="*{phone}"
                           placeholder="0912345678"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('phone')} ? 'border-rose-400 bg-rose-50/30' : ''">
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>
            </div>

            <!-- Password & Confirm Password -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Mật khẩu <span class="text-rose-500">*</span>
                    </label>
                    <input type="password" id="password" th:field="*{password}"
                           placeholder="••••••••"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('password')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Xác nhận mật khẩu <span class="text-rose-500">*</span>
                    </label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           placeholder="••••••••"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>
            </div>
        </div>

        <!-- SECTION 2: THÔNG TIN CÔNG TY -->
        <div class="space-y-4 pt-4 border-t border-slate-100">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-100">
                <i data-lucide="building" class="w-4 h-4 text-emerald-600"></i>
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-900">2. Thông Tin Doanh Nghiệp</h2>
            </div>

            <!-- Company Name & Tax Code -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="companyName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Tên công ty <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="companyName" th:field="*{companyName}"
                           placeholder="Công ty Cổ phần ABC"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('companyName')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></p>
                </div>

                <div>
                    <label for="taxCode" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Mã số thuế doanh nghiệp <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="taxCode" th:field="*{taxCode}"
                           placeholder="0101234567"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('taxCode')} ? 'border-rose-400 bg-rose-50/30' : ''" required>
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('taxCode')}" th:errors="*{taxCode}"></p>
                </div>
            </div>

            <!-- Company Email & Phone -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="companyEmail" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Email liên hệ công ty
                    </label>
                    <input type="email" id="companyEmail" th:field="*{companyEmail}"
                           placeholder="contact@company.com"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
                           th:classappend="${#fields.hasErrors('companyEmail')} ? 'border-rose-400 bg-rose-50/30' : ''">
                    <p class="text-xs text-rose-600 mt-1" th:if="${#fields.hasErrors('companyEmail')}" th:errors="*{companyEmail}"></p>
                </div>

                <div>
                    <label for="companyPhone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Hotline công ty
                    </label>
                    <input type="text" id="companyPhone" th:field="*{companyPhone}"
                           placeholder="024 1234 5678"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
                </div>
            </div>

            <!-- Company Size & Website -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="companySize" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Quy mô công ty
                    </label>
                    <select id="companySize" th:field="*{companySize}"
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
                        <option value="">-- Chọn quy mô --</option>
                        <option value="Dưới 20 người">Dưới 20 người</option>
                        <option value="20 - 50 người">20 - 50 người</option>
                        <option value="50 - 150 người">50 - 150 người</option>
                        <option value="150 - 500 người">150 - 500 người</option>
                        <option value="Trên 500 người">Trên 500 người</option>
                    </select>
                </div>

                <div>
                    <label for="companyWebsite" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Website công ty
                    </label>
                    <input type="url" id="companyWebsite" th:field="*{companyWebsite}"
                           placeholder="https://company.com"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
                </div>
            </div>

            <!-- Address -->
            <div>
                <label for="companyAddress" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Địa chỉ trụ sở công ty
                </label>
                <input type="text" id="companyAddress" th:field="*{companyAddress}"
                       placeholder="Tòa nhà, số đường, Quận/Huyện, Tỉnh/Thành phố"
                       class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
            </div>

            <!-- Description -->
            <div>
                <label for="companyDescription" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Mô tả / Giới thiệu doanh nghiệp
                </label>
                <textarea id="companyDescription" th:field="*{companyDescription}" rows="3"
                          placeholder="Giới thiệu sơ lược về lĩnh vực hoạt động, văn hóa công ty và môi trường làm việc..."
                          class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"></textarea>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit"
                class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-600/25 transition-all flex items-center justify-center gap-2 mt-6">
            <i data-lucide="building" class="w-4 h-4"></i>
            <span>Đăng Ký Tài Khoản Doanh Nghiệp</span>
        </button>

        <!-- Footer link -->
        <div class="text-center text-xs text-slate-500 pt-4 border-t border-slate-100">
            Đã có tài khoản tuyển dụng?
            <a th:href="@{/login}" class="text-blue-600 font-bold hover:underline ml-1">Đăng nhập ngay</a>
        </div>
    </form>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
