<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử giao dịch</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #fff;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title h2 {
            color: #111827;
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }
        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f3f4f6;
            color: #4b5563;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background-color: #e5e7eb;
            color: #111827;
        }

        /* Bảng dữ liệu */
        .table-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #f3f4f6;
        }
        .custom-table {
            width: 100%;
            border-collapse: collapse;
        }
        .custom-table th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        .custom-table td {
            padding: 20px 24px;
            border-bottom: 1px solid #f3f4f6;
            color: #374151;
            font-size: 14px;
            vertical-align: middle;
        }
        .custom-table tbody tr {
            transition: background-color 0.15s;
        }
        .custom-table tbody tr:hover {
            background-color: #f9fafb;
        }

        /* Style cho các cột */
        .td-id {
            font-weight: 600;
            color: #111827;
        }
        .td-amount {
            font-weight: 700;
            color: #2563eb; /* Màu xanh dương nổi bật */
            font-size: 15px;
        }

        /* Trạng thái (Badge) */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .badge-pending { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .badge-failed { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        /* Nút thao tác */
        .action-group {
            display: flex;
            gap: 8px;
        }
        .btn-sm {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-pay { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .btn-pay:hover { background: #dbeafe; }
        .btn-cancel { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .btn-cancel:hover { background: #fee2e2; }
        .text-success { color: #059669; font-weight: 500; display: flex; align-items: center; gap: 4px; }

        /* Thông báo */
        .alert-success {
            background: #ecfdf5;
            color: #065f46;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-weight: 500;
            border: 1px solid #a7f3d0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-section">
        <div class="header-title">
            <svg width="24" height="24" fill="none" stroke="#2563eb" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            <h2>Lịch sử giao dịch</h2>
        </div>
        <a th:href="@{/pricing}" class="btn-back">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Quay lại Bảng giá
        </a>
    </div>

    <!-- Thông báo thành công -->
    <div th:if="${param.success}" class="alert-success">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Thanh toán thành công! Gói dịch vụ của bạn đã được kích hoạt.
    </div>

    <!-- Bảng dữ liệu -->
    <div class="table-card">
        <table class="custom-table">
            <thead>
            <tr>
                <th>Mã GD</th>
                <th>Tên Gói</th>
                <th>Số tiền</th>
                <th>Ngày tạo</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${payments}">
                <td class="td-id" th:text="'#' + ${p.id}"></td>
                <td style="font-weight: 500; color: #1f2937;" th:text="${p.servicePackage.name}"></td>
                <td class="td-amount" th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                <td style="color: #6b7280;" th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}"></td>

                <!-- Trạng thái -->
                <td>
                    <span class="badge badge-pending" th:if="${p.status == 'PENDING'}">
                        <span style="width:6px; height:6px; border-radius:50%; background:#d97706;"></span> Chờ thanh toán
                    </span>
                    <span class="badge badge-success" th:if="${p.status == 'SUCCESS'}">
                        <span style="width:6px; height:6px; border-radius:50%; background:#059669;"></span> Thành công
                    </span>
                    <span class="badge badge-failed" th:if="${p.status == 'FAILED'}">
                        <span style="width:6px; height:6px; border-radius:50%; background:#dc2626;"></span> Thất bại
                    </span>
                </td>

                <!-- Hành động -->
                <td>
                    <div th:if="${p.status == 'PENDING'}" class="action-group">
                        <a th:href="@{'/pricing/resume/' + ${p.id}}" class="btn-sm btn-pay">Thanh toán</a>
                        <form th:action="@{'/pricing/cancel/' + ${p.id}}" method="post" style="margin: 0;">
                            <button type="submit" class="btn-sm btn-cancel" onclick="return confirm('Hủy hóa đơn này?')">Hủy</button>
                        </form>
                    </div>

                    <span th:if="${p.status == 'SUCCESS'}" class="text-success">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        Đã kích hoạt
                    </span>
                </td>
            </tr>

            <!-- Khi không có dữ liệu -->
            <tr th:if="${payments != null and payments.isEmpty()}">
                <td colspan="6" style="text-align: center; padding: 60px 20px;">
                    <svg width="48" height="48" fill="none" stroke="#d1d5db" stroke-width="1.5" viewBox="0 0 24 24" style="margin: 0 auto 12px;"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                    <div style="color: #6b7280; font-weight: 500;">Bạn chưa có giao dịch nào</div>
                    <div style="color: #9ca3af; font-size: 13px; margin-top: 4px;">Các giao dịch mua gói sẽ xuất hiện tại đây.</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
