<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thành công</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .success-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }
        .icon-circle svg {
            width: 40px;
            height: 40px;
        }
        h1 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-home {
            background: #2a6df4;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn-home:hover {
            background: #1d5ad6;
        }
        .btn-history {
            background: #f1f5f9;
            color: #475569;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn-history:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="success-card">
    <!-- Vòng tròn Icon -->
    <div class="icon-circle">
        <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>

    <h1>Thanh toán thành công!</h1>
    <p>Cảm ơn bạn đã tin tưởng và sử dụng dịch vụ. Gói dịch vụ của bạn đã được kích hoạt và sẵn sàng để sử dụng.</p>

    <!-- Nút điều hướng -->
    <div class="btn-group">
        <a th:href="@{/recruiter/jobs/new}" class="btn-home">Bắt đầu đăng tin ngay</a>
        <a th:href="@{/pricing/history}" class="btn-history">Xem lịch sử giao dịch</a>
    </div>
</div>

</body>
</html>
