<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body style="background: #f4f6fa; margin: 0; padding: 40px 20px;">

<div class="section" style="max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; text-align: center;">
    <h2 style="color: #1a2b4a;">Thanh toán đơn hàng #<span th:text="${payment.id}"></span></h2>

    <div style="margin: 20px 0;">
        <!-- Nhớ thay số tài khoản và tên của bạn vào đây -->
        <img th:src="|https://img.vietqr.io/image/VCB-0123456789-compact2.png?amount=${payment.amount}&addInfo=MUA${payment.id}&accountName=NGUYEN VAN HAI|"
             alt="QR Code" style="width: 300px; border-radius: 8px; border: 1px solid #eef1f6;">
    </div>

    <div style="background: #f7f9fc; padding: 16px; border-radius: 8px; margin-bottom: 20px; text-align: left;">
        <p><b>Số tiền:</b> <span style="color: #d33; font-weight: bold;" th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span></p>
        <p><b>Nội dung:</b> <span style="color: #2a6df4; font-weight: bold;" th:text="'MUA GOI ' + ${payment.id}"></span></p>
    </div>

    <div style="color: #2a6df4; font-weight: bold; font-size: 16px;">
        ⏳ Đang chờ xác nhận thanh toán...
        <p style="font-size: 13px; color: #8895a8; font-weight: normal; margin-top: 5px;">
            Hệ thống sẽ tự động chuyển trang ngay khi nhận được tiền.
        </p>
    </div>
</div>

<script th:inline="javascript">
    const paymentId = /*[[${payment.id}]]*/ 0;

    // Hỏi server mỗi 2 giây xem tiền vào chưa
    const checkStatus = setInterval(function() {
        fetch('/pricing/api/payment-status/' + paymentId)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'SUCCESS') {
                    clearInterval(checkStatus);
                    window.location.href = '/pricing/history?success=true';
                }
            })
            .catch(err => console.error(err));
    }, 2000); // 2000ms = 2 giây
</script>

</body>
</html>
