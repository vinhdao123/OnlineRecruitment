<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Hồ sơ: ' + ${applicationData['candidateName'] != null ? applicationData['candidateName'] : 'Ứng viên'} + ' | Online Recruitment'">Xem hồ sơ ứng viên | Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
    <style>
        .recruiter-app-meta-bar {
            max-width: 820px;
            margin: 0 auto 18px;
            padding: 14px 20px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }
        .recruiter-app-meta-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 18px;
            font-size: 14px;
            color: #334155;
        }
        .recruiter-app-meta-info strong {
            color: #0f172a;
        }
        .recruiter-tpl-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 600;
        }
        @media print {
            .recruiter-app-meta-bar { display: none !important; }
        }
    </style>
</head>
<body class="preview-body-bg">

<!-- THANH CÔNG CỤ DÀNH CHO RECRUITER (Ẩn khi in) -->
<div class="preview-toolbar">
    <a th:href="@{/recruiter/applications}" class="preview-btn preview-btn-secondary">&larr; Quay lại danh sách ứng tuyển</a>
    <button th:unless="${cv != null and cv.isUploaded}" type="button" onclick="window.print()" class="preview-btn preview-btn-primary">🖨️ In / Xuất PDF</button>
    <a th:if="${applicationData['cvFilePathSnapshot'] != null and !#strings.isEmpty(applicationData['cvFilePathSnapshot'])}"
       th:href="@{/recruiter/applications/{id}/cv-file(id=${applicationData['applicationId']})}"
       class="preview-btn preview-btn-primary">⬇ Tải file CV đính kèm</a>
</div>

<!-- THÔNG TIN ĐƠN ỨNG TUYỂN (Ẩn khi in) -->
<div class="recruiter-app-meta-bar">
    <div class="recruiter-app-meta-info">
        <span>Ứng viên: <strong th:text="${applicationData['candidateName'] != null ? applicationData['candidateName'] : 'Chưa cập nhật'}">Ứng viên</strong></span>
        <span>&bull;</span>
        <span>Vị trí: <strong th:text="${applicationData['jobTitle'] != null ? applicationData['jobTitle'] : 'Chưa cập nhật'}">Vị trí</strong></span>
        <span>&bull;</span>
        <span>Công ty: <strong th:text="${applicationData['companyName'] != null ? applicationData['companyName'] : 'Chưa cập nhật'}">Công ty</strong></span>
    </div>
    <span class="recruiter-tpl-pill" th:if="${templateName != null && (cv == null || !cv.isUploaded)}"
          th:text="'Mẫu: ' + ${templateName}">Mẫu CV</span>
</div>

<!-- HIỂN THỊ FULL CV THEO ĐÚNG 5 MẪU TEMPLATE CỦA CANDIDATE (HOẶC PDF UPLOAD) -->
<th:block th:if="${cv != null}">
    <th:block th:replace="~{candidate/cv/preview :: cvDocument}"></th:block>
</th:block>

</body>
</html>
