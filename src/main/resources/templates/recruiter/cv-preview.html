<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Hồ sơ: ' + ${applicationData['candidateName'] != null ? applicationData['candidateName'] : 'Ứng viên'} + ' | OnlineRecruitment'">Xem hồ sơ ứng viên | OnlineRecruitment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen py-6 px-4 antialiased">

<!-- THANH CÔNG CỤ DÀNH CHO RECRUITER (Ẩn khi in) -->
<div class="no-print max-w-4xl mx-auto mb-6 bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <a th:href="@{/recruiter/applications}"
       class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Quay lại danh sách ứng tuyển
    </a>

    <div class="flex items-center gap-2.5">
        <button th:unless="${cv != null and cv.isUploaded}" type="button" onclick="window.print()"
                class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold transition-all shadow-sm">
            <i data-lucide="printer" class="w-3.5 h-3.5"></i>
            <span>In / Xuất PDF</span>
        </button>

        <a th:if="${applicationData['cvFilePathSnapshot'] != null and !#strings.isEmpty(applicationData['cvFilePathSnapshot'])}"
           th:href="@{/recruiter/applications/{id}/cv-file(id=${applicationData['applicationId']})}"
           class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md shadow-blue-600/20 transition-all">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span>Tải file CV đính kèm</span>
        </a>
    </div>
</div>

<!-- THÔNG TIN SNAPSHOT ĐƠN ỨNG TUYỂN (Ẩn khi in) -->
<div class="no-print max-w-4xl mx-auto mb-6 bg-blue-50/80 border border-blue-200/80 rounded-2xl p-4 text-xs text-blue-900 flex flex-wrap items-center justify-between gap-3">
    <div class="flex flex-wrap items-center gap-4">
        <span class="flex items-center gap-1.5">
            <i data-lucide="user" class="w-3.5 h-3.5 text-blue-600"></i>
            <span>Ứng viên: <strong class="font-bold text-slate-900" th:text="${applicationData['candidateName'] != null ? applicationData['candidateName'] : 'Chưa cập nhật'}">Ứng viên</strong></span>
        </span>
        <span class="flex items-center gap-1.5">
            <i data-lucide="briefcase" class="w-3.5 h-3.5 text-blue-600"></i>
            <span>Vị trí: <strong class="font-bold text-slate-900" th:text="${applicationData['jobTitle'] != null ? applicationData['jobTitle'] : 'Chưa cập nhật'}">Vị trí</strong></span>
        </span>
        <span class="flex items-center gap-1.5">
            <i data-lucide="building" class="w-3.5 h-3.5 text-blue-600"></i>
            <span>Công ty: <strong class="font-bold text-slate-900" th:text="${applicationData['companyName'] != null ? applicationData['companyName'] : 'Chưa cập nhật'}">Công ty</strong></span>
        </span>
    </div>

    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 font-bold text-[11px]"
          th:if="${templateName != null and (cv == null or !cv.isUploaded)}"
          th:text="'Mẫu: ' + ${templateName}">Mẫu CV</span>
</div>

<!-- HIỂN THỊ NỘI DUNG CV -->
<div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
    <th:block th:if="${cv != null}">
        <th:block th:replace="~{candidate/cv/preview :: cvDocument}"></th:block>
    </th:block>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
