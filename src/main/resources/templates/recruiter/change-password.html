<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thay đổi mật khẩu — Nhà tuyển dụng</title>
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>

    <!-- Taskbar Header -->
    <div th:replace="~{fragments/taskbar :: taskbar('profile')}"></div>

    <main class="main-wrapper">
        <div class="password-box">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="width: 56px; height: 56px; border-radius: 50%; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h1 style="font-size: 22px; font-weight: 700; color: #111827; margin: 0 0 8px 0;">Thay đổi mật khẩu tài khoản</h1>
                <p style="font-size: 14px; color: #6b7280; margin: 0;">Bảo mật thông tin doanh nghiệp bằng cách xác thực mã OTP qua Gmail trước khi thiết lập mật khẩu mới.</p>
            </div>

            <!-- Alerts -->
            <div th:if="${successMessage}" class="alert alert-success">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- Form Bước 1: Gửi mã OTP -->
            <form th:action="@{/recruiter/change-password/send-otp}" method="post" style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px dashed #e5e7eb;">
                <div class="form-group">
                    <label class="form-label">Gmail tài khoản nhà tuyển dụng <span class="required">*</span></label>
                    <div class="otp-input-group">
                        <input type="email" name="email" class="form-input"
                               th:value="${inputEmail != null ? inputEmail : accountUser.email}"
                               placeholder="Nhập Gmail tài khoản của bạn" required>
                        <button type="submit" class="btn btn-primary" style="white-space: nowrap;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            Gửi mã OTP qua Gmail
                        </button>
                    </div>
                    <div class="form-hint">Mã OTP gồm 6 chữ số sẽ được gửi tới hòm thư Gmail của tài khoản.</div>
                </div>
            </form>

            <!-- Form Bước 2: Xác nhận OTP và đặt Mật khẩu mới 2 lần -->
            <form th:action="@{/recruiter/change-password}" method="post">
                <input type="hidden" name="email" th:value="${inputEmail != null ? inputEmail : accountUser.email}">

                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label">Mã xác thực OTP (6 chữ số) <span class="required">*</span></label>
                    <input type="text" name="otp" class="form-input" maxlength="6"
                           th:value="${inputOtp != null ? inputOtp : ''}"
                           placeholder="Nhập mã 6 chữ số được gửi về email" required>
                    <div class="form-hint">Kiểm tra hộp thư đến hoặc thư mục Spam trong Gmail.</div>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label">Mật khẩu mới <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input type="password" id="recNewPass" name="newPassword" class="form-input" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                        <button type="button" onclick="togglePass('recNewPass')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6b7280; font-size: 13px;">Hiện/Ẩn</button>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Xác nhận mật khẩu mới <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input type="password" id="recConfirmPass" name="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu mới" required minlength="6">
                        <button type="button" onclick="togglePass('recConfirmPass')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6b7280; font-size: 13px;">Hiện/Ẩn</button>
                    </div>
                </div>

                <div class="form-actions" style="border: none; padding: 0; margin-top: 10px;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        Xác nhận đổi mật khẩu
                    </button>
                </div>

                <div style="text-align: center; margin-top: 18px;">
                    <a th:href="@{/recruiter/profile}" style="font-size: 14px; color: #2563eb; text-decoration: none;">← Quay lại hồ sơ doanh nghiệp</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function togglePass(id) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>
</body>
</html>
