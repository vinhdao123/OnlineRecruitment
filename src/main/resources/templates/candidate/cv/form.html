<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Chỉnh sửa CV — Online Recruitment' : 'Tạo CV mới — Online Recruitment'">Tạo CV mới — Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/fragments/taskbar.css}">
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-sidebar.css}">
</head>
<body>

<!-- ================= TASKBAR ================= -->
<div th:replace="~{fragments/taskbar :: taskbar('cvs')}"></div>

<!-- ================= LAYOUT CHÍNH ================= -->
<div class="cv-dashboard-layout">

    <!-- ================= SIDEBAR ================= -->
    <aside class="cv-sidebar">
        <div class="cv-sidebar-menu">
            <div class="cv-sidebar-title">Quản lý chung</div>
            <a th:href="@{/candidate/cvs}" class="cv-sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                My CV
            </a>
            <a th:href="@{/candidate/cvs/gallery}" class="cv-sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Template CV
            </a>
        </div>
    </aside>

    <!-- ================= NỘI DUNG CHÍNH ================= -->
    <main class="main-content">

        <div class="cv-breadcrumb">
            <a th:href="@{/}">Trang chủ</a>
            <span>/</span>
            <a th:href="@{/candidate/cvs}">My CV</a>
            <span>/</span>
            <span class="current" th:text="${isEdit} ? 'Chỉnh sửa CV' : 'Tạo CV mới'">Tạo CV mới</span>
        </div>

        <div class="page-header">
            <div>
                <h2 class="page-title" th:text="${isEdit} ? 'Chỉnh sửa thông tin CV' : 'Tạo CV mới'">Tạo CV mới</h2>
                <p class="page-subtitle">Khởi tạo hồ sơ ứng tuyển và chọn bố cục trình bày phù hợp.</p>
            </div>
            <a th:href="@{/candidate/cvs}" class="btn-link">&larr; Quay lại danh sách</a>
        </div>

        <div th:if="${errorMessage}" class="flash-error" th:text="${errorMessage}"></div>

        <div class="form-card">
            <form th:action="${isEdit} ? @{/candidate/cvs/{id}/update(id=${cvId})} : @{/candidate/cvs/create}"
                  th:object="${cvRequest}" method="post" enctype="multipart/form-data">

                <input th:if="${sourceCvId != null}" type="hidden" name="sourceCvId" th:value="${sourceCvId}">

                <div class="form-grid">
                    <!-- Chọn Template (Chỉ hiện khi Tạo mới) -->
                    <div class="form-group full-width" th:if="${!isEdit}">
                        <label class="form-label">Mẫu CV <span class="required-star">*</span></label>
                        <select th:field="*{templateVersionId}" class="form-control">
                            <option value="">-- Chọn mẫu CV --</option>
                            <option th:each="t : ${templates}" th:value="${t.id}"
                                    th:text="${t.templateName + ' (Phiên bản ' + t.versionNumber + ')'}"></option>
                        </select>
                        <span th:if="${#fields.hasErrors('templateVersionId')}" th:errors="*{templateVersionId}" class="field-error"></span>
                    </div>

                    <!-- Tiêu đề / Tên CV -->
                    <div class="form-group">
                        <label class="form-label">Đặt tên cho CV <span class="required-star">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="VD: CV Kỹ sư Phần mềm - Nguyễn Văn A" required>
                        <span class="form-hint">Đặt tên giúp bạn dễ phân biệt khi quản lý nhiều hồ sơ CV.</span>
                        <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="field-error"></span>
                    </div>

                    <!-- Chức danh -->
                    <div class="form-group">
                        <label class="form-label">Chức danh nghề nghiệp</label>
                        <input type="text" th:field="*{professionalTitle}" class="form-control" placeholder="VD: Business Development Executive">
                        <span th:if="${#fields.hasErrors('professionalTitle')}" th:errors="*{professionalTitle}" class="field-error"></span>
                    </div>

                    <!-- Tóm tắt -->
                    <div class="form-group full-width">
                        <label class="form-label">Tóm tắt bản thân / Mục tiêu nghề nghiệp</label>
                        <textarea th:field="*{summary}" class="form-control" rows="4" placeholder="Mô tả ngắn gọn về kinh nghiệm, kỹ năng và mục tiêu nghề nghiệp của bạn..."></textarea>
                        <span th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}" class="field-error"></span>
                    </div>

                    <!-- Màu chủ đạo -->
                    <div class="form-group full-width">
                        <label class="form-label">Màu chủ đạo CV</label>
                        <div class="color-field">
                            <input type="color" th:field="*{accentColor}" class="color-input">
                            <span class="form-hint">Chọn màu sắc chủ đạo cho CV của bạn.</span>
                        </div>
                        <span th:if="${#fields.hasErrors('accentColor')}" th:errors="*{accentColor}" class="field-error"></span>
                    </div>
                </div>

                <!-- Nút Hành động -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit" th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo CV'">Tạo CV</button>
                    <a th:href="${isEdit} ? @{/candidate/cvs/{id}(id=${cvId})} : @{/candidate/cvs}" class="btn-link-outline">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
