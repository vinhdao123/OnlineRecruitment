<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thư viện Template CV — Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
</head>
<body>
<!-- TASKBAR -->
<header class="header">
    <div class="header-container">
        <a th:href="@{/}" class="logo"><div class="logo-icon">OR</div> Online Recruitment</a>
        <nav class="nav">
            <a th:href="@{/}">Trang chủ</a>
            <a th:href="@{/jobs}">Tìm việc làm</a>
            <a th:href="@{/candidate/dashboard}">Bảng điều khiển</a>
            <a th:href="@{/candidate/profile}">Hồ sơ của tôi</a>
            <a th:href="@{/candidate/cvs}" class="active">CV</a>
        </nav>
        <div class="user-menu">
            <div class="user-avatar" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">C</div>
            <div class="user-info">
                <span class="user-name" th:text="${#authentication.name}">candidate</span>
                <span class="user-role">ỨNG VIÊN</span>
            </div>
        </div>
    </div>
</header>

<div class="cv-dashboard-layout">
    <!-- SIDEBAR -->
    <aside class="cv-sidebar">
        <div class="cv-sidebar-menu">
            <a th:href="@{/candidate/cvs}" class="cv-sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                My CV
            </a>
            <a th:href="@{/candidate/cv-templates}" class="cv-sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Template CV
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-header">
            <div>
                <h2 class="page-title">Thư viện Template CV</h2>
                <p class="page-subtitle">Chọn một mẫu thiết kế đẹp để tạo CV của bạn.</p>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchTemplate" placeholder="Tìm kiếm template...">
            </div>
        </div>

        <!-- Grid Template -->
        <div class="cv-grid">
            <!-- Mẫu 1 -->
            <div class="cv-card template-card">
                <div class="cv-preview-card" style="background: #f1f5f9; justify-content: center; align-items: center;">
                    <div style="width: 80%; height: 80%; background: white; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 8px solid #2563eb; display: flex; flex-direction: column; padding: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; margin-bottom: 10px;"></div>
                        <div style="height: 6px; background: #cbd5e1; width: 60%; margin-bottom: 6px;"></div>
                        <div style="height: 4px; background: #e2e8f0; width: 40%;"></div>
                    </div>
                </div>
                <div class="cv-card-footer">
                    <h3 class="cv-card-title">Mẫu Hiện Đại</h3>
                    <p class="page-subtitle" style="margin-bottom: 12px;">Thiết kế đại, chuyên nghiệp</p>
                    <a th:href="@{/candidate/cvs/new(templateId=1)}" class="btn-primary" style="justify-content: center;">Sử dụng mẫu</a>
                </div>
            </div>

            <!-- Mẫu 2 -->
            <div class="cv-card template-card">
                <div class="cv-preview-card" style="background: #f1f5f9; justify-content: center; align-items: center;">
                    <div style="width: 80%; height: 80%; background: white; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 8px solid #10b981; display: flex; flex-direction: column; padding: 10px;">
                        <div style="height: 6px; background: #cbd5e1; width: 50%; margin-bottom: 6px; margin-top: 10px;"></div>
                        <div style="height: 4px; background: #e2e8f0; width: 30%;"></div>
                    </div>
                </div>
                <div class="cv-card-footer">
                    <h3 class="cv-card-title">Mẫu Tối Giản</h3>
                    <p class="page-subtitle" style="margin-bottom: 12px;">Đơn giản, tinh tế</p>
                    <a th:href="@{/candidate/cvs/new(templateId=1, sourceCvId=1)}" class="btn-primary" style="justify-content: center;">Sử dụng mẫu</a>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
