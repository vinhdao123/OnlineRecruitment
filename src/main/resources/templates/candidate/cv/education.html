<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học vấn — Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS DÙNG CHUNG (SIDEBAR + LAYOUT) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc !important; color: #1e293b; }

        /* TASKBAR */
        .header { background: white; border-bottom: 1px solid #e5e7eb; padding: 12px 0; position: sticky; top: 0; z-index: 1000; }
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1f2937; font-weight: 700; font-size: 20px; }
        .logo-icon { background: #2563EB; color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .nav { display: flex; gap: 24px; font-weight: 500; font-size: 15px; }
        .nav a { color: #4b5563; text-decoration: none; }
        .nav a:hover, .nav a.active { color: #2563EB; font-weight: 600; }
        .user-menu { display: flex; align-items: center; gap: 12px; }
        .user-avatar { background: #eff6ff; color: #2563EB; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .user-info { display: flex; flex-direction: column; line-height: 1.2; }
        .user-name { font-weight: 600; font-size: 14px; color: #1f2937; }
        .user-role { font-size: 12px; color: #6b7280; }

        /* LAYOUT & SIDEBAR */
        .dashboard-layout { display: flex; max-width: 1200px; margin: 24px auto; padding: 0 20px; gap: 24px; align-items: flex-start; }
        .sidebar { width: 260px; flex-shrink: 0; }
        .sidebar-menu { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 12px; }
        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #475569; text-decoration: none; border-radius: 8px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; }
        .sidebar-item.active { background: #eff6ff; color: #2563eb; font-weight: 600; }
        .sidebar-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .main-content { flex-grow: 1; min-width: 0; }

        /* FORM & LIST (Học vấn) */
        .cv-page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .cv-page-title { font-size: 24px; font-weight: 700; color: #0f172a; }
        .cv-btn-link { color: #2563eb; text-decoration: none; font-weight: 500; font-size: 14px; }
        .cv-form-container { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 32px; }
        .cv-form-title { margin-top: 0; font-size: 16px; margin-bottom: 16px; }
        .cv-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .cv-form-group { margin-bottom: 16px; }
        .cv-form-group.full-width { grid-column: span 2; }
        .cv-form-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151; }
        .cv-form-control { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
        .cv-form-control:focus { border-color: #2563eb; }
        textarea.cv-form-control { resize: vertical; min-height: 80px; }
        .cv-btn-submit { background: #2563eb; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 500; border: none; cursor: pointer; font-size: 14px; }
        .cv-item-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; background: #f8fafc; }
        .cv-item-title { font-size: 16px; font-weight: 600; color: #0f172a; margin: 0 0 4px 0; }
        .cv-item-subtitle { font-size: 14px; color: #475569; margin: 0 0 4px 0; }
        .cv-item-meta { font-size: 13px; color: #64748b; }
        .cv-item-desc { font-size: 14px; color: #334155; margin-top: 8px; white-space: pre-wrap; }
        .cv-btn-delete { background: #ef4444; color: white; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>

<!-- TASKBAR -->
<header class="header">
    <div class="header-container">
        <a th:href="@{/}" class="logo"><div class="logo-icon">OR</div> Online Recruitment</a>
        <nav class="nav">
            <a th:href="@{/}">Trang chủ</a>
            <a th:href="@{/jobs}">Tìm việc làm</a>
            <a th:href="@{/candidate/dashboard}">Bảng điều khiển</a>
            <a th:href="@{/candidate/profile}">Hồ sơ của tôi</a>
            <a th:href="@{/candidate/cvs}" class="active">CV</a>
        </nav>
        <div class="user-menu">
            <div class="user-avatar" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">C</div>
            <div class="user-info">
                <span class="user-name" th:text="${#authentication.name}">candidate</span>
                <span class="user-role">ỨNG VIÊN</span>
            </div>
        </div>
    </div>
</header>

<!-- LAYOUT CHÍNH -->
<div class="dashboard-layout">

    <!-- THẺ ASIDE (SIDEBAR) ĐÃ CÓ MẶT Ở ĐÂY -->
    <aside class="sidebar">
        <div class="sidebar-menu">
            <a th:href="@{/candidate/cvs}" class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                My CV
            </a>
            <a th:href="@{/candidate/cv-templates}" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Template CV
            </a>
        </div>

    </aside>

    <!-- NỘI DUNG CHÍNH (FORM HỌC VẤN) -->
    <main class="main-content">
        <div class="cv-page-header">
            <div>
                <h2 class="cv-page-title">Học vấn</h2>
                <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Đang chỉnh sửa cho CV: <b th:text="${cv.title}"></b></p>
            </div>
            <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" class="cv-btn-link">&larr; Quay lại chi tiết CV</a>
        </div>

        <!-- Form của bạn (giữ nguyên như cũ) -->
        <div class="cv-form-container">
            <h3 class="cv-form-title">Thêm học vấn mới</h3>
            <form th:action="@{/candidate/cvs/{id}/educations/add(id=${cv.id})}" th:object="${eduRequest}" method="post">
                <div class="cv-form-grid">
                    <div class="cv-form-group full-width">
                        <label class="cv-form-label">Tên trường / Tổ chức (*)</label>
                        <input type="text" th:field="*{institution}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Bằng cấp</label>
                        <input type="text" th:field="*{degree}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Chuyên ngành</label>
                        <input type="text" th:field="*{fieldOfStudy}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Ngày bắt đầu</label>
                        <input type="date" th:field="*{startDate}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Ngày kết thúc</label>
                        <input type="date" th:field="*{endDate}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Xếp loại</label>
                        <select th:field="*{academicRank}" class="cv-form-control">
                            <option value="">-- Chọn xếp loại --</option>
                            <option value="Trung bình">Trung bình</option>
                            <option value="Khá">Khá</option>
                            <option value="Giỏi">Giỏi</option>
                        </select>
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">GPA (Hệ 4.0)</label>
                        <input type="number" step="0.01" min="0" max="4.0" th:field="*{gpa}" class="cv-form-control" placeholder="VD: 3.2">
                    </div>
                    <div class="cv-form-group full-width">
                        <label class="cv-form-label">Mô tả chi tiết</label>
                        <textarea th:field="*{description}" class="cv-form-control" rows="3"></textarea>
                    </div>
                </div>
                <button type="submit" class="cv-btn-submit">Thêm học vấn</button>
            </form>
        </div>

        <!-- Danh sách học vấn (giữ nguyên như cũ) -->
        <h3 style="margin-top: 0; font-size: 16px; margin-bottom: 12px;">Danh sách học vấn</h3>
        <div th:if="${educations.isEmpty()}" style="color: #64748b; font-style: italic;">Chưa có thông tin học vấn nào.</div>
        <div th:each="edu : ${educations}" class="cv-item-card">
            <div>
                <h4 class="cv-item-title" th:text="${edu.institution}"></h4>
                <p class="cv-item-subtitle">
                    <span th:text="${edu.degree}"></span> <span th:if="${edu.fieldOfStudy != null}" th:text="' - ' + ${edu.fieldOfStudy}"></span>
                </p>
                <p class="cv-item-meta">
                    <span th:text="${edu.startDate != null ? #temporals.format(edu.startDate, 'MM/yyyy') : ''}"></span> -
                    <span th:text="${edu.endDate != null ? #temporals.format(edu.endDate, 'MM/yyyy') : 'Hiện tại'}"></span>
                    <span th:if="${edu.grade != null}" th:text="' | ' + ${edu.grade}" style="font-weight: 500;"></span>
                </p>
                <p class="cv-item-desc" th:text="${edu.description}"></p>
            </div>
            <form th:action="@{/candidate/cvs/{id}/educations/{eduId}/delete(id=${cv.id}, eduId=${edu.id})}" method="post" onsubmit="return confirm('Xóa học vấn này?');">
                <button type="submit" class="cv-btn-delete">Xóa</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
