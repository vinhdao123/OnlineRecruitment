<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Kinh nghiệm làm việc — Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Gọi CSS của nhóm (để Taskbar đẹp) -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <!-- Gọi CSS của chúng ta (Đã sửa đường dẫn có thư mục Candidate) -->
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
</head>
<body>

<!-- GỌI TASKBAR CỦA NHÓM -->
<div style="position: relative; z-index: 1000; width: 100%;">
    <div th:replace="~{fragments/taskbar :: taskbar('cvs')}"></div>
</div>

<div class="cv-dashboard-layout">
    <aside class="cv-sidebar">
        <div class="cv-sidebar-menu">
            <a th:href="@{/candidate/cvs}" class="cv-sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                CV của tôi
            </a>
            <a th:href="@{/candidate/cv-templates}" class="cv-sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Hồ sơ mẫu
            </a>
        </div>
    </aside>

    <main class="cv-main-content">
        <div class="cv-page-header">
            <div>
                <h2 class="cv-page-title">Kinh nghiệm làm việc</h2>
                <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Đang chỉnh sửa cho CV: <b th:text="${cv.title}"></b></p>
            </div>
            <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" class="cv-btn-link">&larr; Quay lại chi tiết CV</a>
        </div>

        <div th:if="${successMessage}" class="cv-alert cv-alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="cv-alert cv-alert-danger" th:text="${errorMessage}"></div>

        <div class="cv-form-container">
            <h3 class="cv-form-title">Thêm kinh nghiệm mới</h3>
            <form th:action="@{/candidate/cvs/{id}/work-experiences/add(id=${cv.id})}" th:object="${workRequest}" method="post">
                <div class="cv-form-grid">
                    <div class="cv-form-group">
                        <label class="cv-form-label">Tên công ty (*)</label>
                        <input type="text" th:field="*{companyName}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Chức danh (*)</label>
                        <input type="text" th:field="*{jobTitle}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Địa điểm</label>
                        <input type="text" th:field="*{location}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Ngày bắt đầu</label>
                        <input type="date" th:field="*{startDate}" id="startDate" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Ngày kết thúc</label>
                        <input type="date" th:field="*{endDate}" id="endDate" class="cv-form-control">
                    </div>
                    <div class="cv-form-group" style="display: flex; align-items: center; margin-top: 20px;">
                        <input type="checkbox" th:field="*{isCurrent}" id="isCurrent" style="margin-right: 8px;">
                        <label for="isCurrent" style="font-weight: 500; font-size: 14px; cursor: pointer;">Hiện đang làm việc tại đây</label>
                    </div>
                    <div class="cv-form-group full-width">
                        <label class="cv-form-label">Mô tả công việc</label>
                        <textarea th:field="*{description}" class="cv-form-control" rows="3"></textarea>
                    </div>
                </div>
                <button type="submit" class="cv-btn-submit">Thêm kinh nghiệm</button>
            </form>
        </div>

        <h3 class="cv-section-title">Danh sách kinh nghiệm</h3>
        <div th:if="${works.isEmpty()}" class="cv-empty-text">Chưa có kinh nghiệm nào.</div>
        <div th:each="work : ${works}" class="cv-item-card">
            <div>
                <h4 class="cv-item-title" th:text="${work.jobTitle}"></h4>
                <p class="cv-item-subtitle" th:text="${work.companyName}"></p>
                <p class="cv-item-meta">
                    <span th:text="${work.startDate != null ? #temporals.format(work.startDate, 'MM/yyyy') : ''}"></span> -
                    <span th:text="${work.isCurrent ? 'Hiện tại' : (work.endDate != null ? #temporals.format(work.endDate, 'MM/yyyy') : '')}"></span>
                </p>
                <p class="cv-item-desc" th:text="${work.description}"></p>
            </div>
            <form th:action="@{/candidate/cvs/{id}/work-experiences/{workId}/delete(id=${cv.id}, workId=${work.id})}" method="post" onsubmit="return confirm('Xóa kinh nghiệm này?');">
                <button type="submit" class="cv-btn-delete">Xóa</button>
            </form>
        </div>
    </main>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const isCurrentCheckbox = document.getElementById('isCurrent');
        const endDateInput = document.getElementById('endDate');
        if(isCurrentCheckbox) {
            isCurrentCheckbox.addEventListener('change', function() {
                if (this.checked) { endDateInput.value = ''; endDateInput.disabled = true; }
                else { endDateInput.disabled = false; }
            });
        }
    });
</script>
</body>
</html>
