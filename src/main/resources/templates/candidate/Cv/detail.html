<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết CV — Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Gọi CSS của nhóm -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
</head>
<body>

<!-- GỌI TASKBAR CỦA NHÓM (Bọc trong div để tránh lỗi layout) -->
<div style="position: relative; z-index: 1000; width: 100%;">
    <div th:replace="~{fragments/taskbar :: taskbar('cvs')}"></div>
</div>

<div class="cv-dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="cv-sidebar">
        <div class="cv-sidebar-menu">
            <a th:href="@{/candidate/cvs}" class="cv-sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                CV của tôi
            </a>
            <a th:href="@{/candidate/cv-templates}" class="cv-sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Hồ sơ mẫu
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="cv-main-content">

        <!-- Thông báo -->
        <div th:if="${successMessage}" class="cv-alert cv-alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="cv-alert cv-alert-danger" th:text="${errorMessage}"></div>

        <!-- Thanh công cụ (Các nút bấm) -->
        <div class="cv-top-actions">
            <h2 class="cv-page-title" style="margin: 0;" th:text="${isEditMode} ? 'Chỉnh sửa thông tin CV' : 'Chi tiết CV'"></h2>

            <div class="cv-btn-group" th:if="${!isEditMode}">
                <a th:href="@{/candidate/cvs/{id}/preview(id=${cv.id})}" target="_blank" class="cv-btn cv-btn-dark">Xem trước CV</a>
                <a th:href="@{/candidate/cvs/{id}/work-experiences(id=${cv.id})}" class="cv-btn cv-btn-blue">Quản lý Kinh nghiệm</a>
                <a th:href="@{/candidate/cvs/{id}/educations(id=${cv.id})}" class="cv-btn cv-btn-green">Quản lý Học vấn</a>
                <a th:href="@{/candidate/cvs/{id}/skills(id=${cv.id})}" class="cv-btn cv-btn-purple">Quản lý Kỹ năng</a>
                <a th:href="@{/candidate/cvs/{id}/projects(id=${cv.id})}" class="cv-btn cv-btn-orange">Quản lý Dự án</a>
                <a th:href="@{/candidate/cvs/{id}(id=${cv.id}, edit=true)}" class="cv-btn cv-btn-yellow">Sửa thông tin</a>
                <a th:href="@{/candidate/cvs}" class="cv-btn cv-btn-grey">Quay lại danh sách</a>
            </div>
        </div>

        <!-- KHUNG NỘI DUNG -->
        <div class="cv-content-box">

            <!-- ================= CHẾ ĐỘ 1: XEM (VIEW MODE) ================= -->
            <div th:if="${!isEditMode}">
                <div class="cv-header-wrapper" th:style="'border-left: 5px solid ' + ${cv.accentColor} + '; padding-left: 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px;'">

                    <!-- Hiển thị ảnh Avatar nếu có -->
                    <img th:if="${cv.avatarUrl != null}" th:src="@{${cv.avatarUrl}}" alt="Avatar"
                         style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid #e2e8f0;">

                    <div>
                        <h1 class="cv-header-title" th:text="${cv.title}"></h1>
                        <p class="cv-subtitle" th:text="${cv.professionalTitle != null ? cv.professionalTitle : 'Chưa cập nhật chức danh'}"></p>
                    </div>
                </div>

                <div class="cv-section-title">Tóm tắt bản thân</div>
                <div class="cv-text" th:text="${cv.summary != null && !cv.summary.isEmpty() ? cv.summary : 'Chưa có thông tin tóm tắt.'}"></div>

                <div class="cv-footer-meta">
                    <span>Mẫu CV: <b th:text="${cv.templateVersion?.template?.name != null ? cv.templateVersion.template.name : 'Mặc định'}"></b></span>
                    <span>Cập nhật lần cuối: <b th:text="${#temporals.format(cv.updatedAt, 'dd/MM/yyyy HH:mm')}"></b></span>
                </div>
            </div>

            <!-- ================= CHẾ ĐỘ 2: SỬA (EDIT MODE) ================= -->
            <!-- Chú ý: Thêm enctype="multipart/form-data" để upload được file -->
            <form th:if="${isEditMode}" th:action="@{/candidate/cvs/{id}/update(id=${cv.id})}" th:object="${cvRequest}" method="post" enctype="multipart/form-data">

                <div class="cv-form-group">
                    <label class="cv-form-label">Tiêu đề CV <span style="color:red">*</span></label>
                    <input type="text" th:field="*{title}" class="cv-form-control">
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="cv-error-text"></span>
                </div>

                <div class="cv-form-group">
                    <label class="cv-form-label">Chức danh nghề nghiệp</label>
                    <input type="text" th:field="*{professionalTitle}" class="cv-form-control">
                </div>

                <div class="cv-form-group">
                    <label class="cv-form-label">Tóm tắt bản thân</label>
                    <textarea th:field="*{summary}" class="cv-form-control" rows="4"></textarea>
                </div>

                <div class="cv-form-group">
                    <label class="cv-form-label">Ảnh đại diện CV (Avatar)</label>
                    <input type="file" name="avatarFile" accept="image/*" class="cv-form-control" style="padding: 8px;">
                    <!-- Giữ lại URL ảnh cũ để không bị mất nếu không chọn ảnh mới -->
                    <input type="hidden" th:field="*{avatarUrl}">
                    <div th:if="${cv.avatarUrl != null}" style="margin-top: 10px;">
                        <img th:src="@{${cv.avatarUrl}}" alt="Avatar" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;">
                    </div>
                </div>

                <div class="cv-form-group">
                    <label class="cv-form-label">Màu chủ đạo CV</label>
                    <div class="cv-color-picker-wrapper">
                        <input type="color" th:field="*{accentColor}">
                        <span style="font-size: 13px; color:#64748b;">Màu này sẽ xuất hiện trên CV xem trước.</span>
                    </div>
                </div>

                <div class="cv-form-actions">
                    <button type="submit" class="cv-btn cv-btn-blue" style="padding: 10px 24px;">Lưu thay đổi</button>
                    <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" class="cv-btn cv-btn-grey" style="padding: 10px 24px;">Hủy bỏ</a>
                </div>
            </form>

        </div>
    </main>
</div>
</body>
</html>
