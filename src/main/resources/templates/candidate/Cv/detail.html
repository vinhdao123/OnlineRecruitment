<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết CV</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="header">
    <div class="container header-container">
        <a th:href="@{/}" class="logo">Online<span>Recruitment</span></a>
        <nav class="nav">
            <a th:href="@{/candidate/dashboard}">Dashboard</a>
            <a th:href="@{/candidate/cvs}" class="active">CV của tôi</a>
        </nav>
    </div>
</header>

<main class="container" style="padding: 40px 20px; max-width: 900px; margin: 0 auto;">

    <!-- Thanh công cụ (Nút hành động) -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0;">Chi tiết CV</h2>
        <div style="display: flex; gap: 10px;">

            <!-- Xem trước -->
            <a th:href="@{/candidate/cvs/{id}/preview(id=${cv.id})}" target="_blank"
               style="padding: 8px 16px; background: #1f2937; color: white; border-radius: 6px; text-decoration: none; font-weight: 500;">Xem trước CV</a>

            <!-- Nút Quản lý Kinh nghiệm (Giai đoạn 3) -->
            <a th:href="@{/candidate/cvs/{id}/work-experiences(id=${cv.id})}"
               style="padding: 8px 16px; background: #2563EB; color: white; border-radius: 6px; text-decoration: none; font-weight: 500;">
                Quản lý Kinh nghiệm
            </a>
            <!-- Quản lý học vấn -->

            <a th:href="@{/candidate/cvs/{id}/educations(id=${cv.id})}"
               style="padding: 8px 16px; background: #10B981; color: white; border-radius: 6px; text-decoration: none; font-weight: 500;">
                Quản lý Học vấn
            </a>

            <!-- Quản lý Kỹ năng -->
            <a th:href="@{/candidate/cvs/{id}/skills(id=${cv.id})}"
               style="padding: 8px 16px; background: #8B5CF6; color: white; border-radius: 6px; text-decoration: none; font-weight: 500;">Quản lý Kỹ năng</a>

            <!-- Quản lý Dự án -->
            <a th:href="@{/candidate/cvs/{id}/projects(id=${cv.id})}"
               style="padding: 8px 16px; background: #F97316; color: white; border-radius: 6px; text-decoration: none; font-weight: 500;">Quản lý Dự án</a>
            <!-- Nút Sửa thông tin cơ bản -->
            <a th:href="@{/candidate/cvs/{id}/edit(id=${cv.id})}"
               style="padding: 8px 16px; background: #f59e0b; color: white; border-radius: 6px; text-decoration: none; font-weight: 500;">
                Sửa thông tin
            </a>

            <!-- Nút Quay lại -->
            <a th:href="@{/candidate/cvs}"
               style="padding: 8px 16px; background: #f3f4f6; color: #374151; border-radius: 6px; text-decoration: none; font-weight: 500;">
                Quay lại
            </a>
        </div>
    </div>

    <!-- Khung hiển thị thông tin CV -->
    <div style="background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px;">

        <!-- Header CV (Tiêu đề + Màu chủ đạo) -->
        <div style="border-bottom: 2px solid" th:style="'border-color: ' + ${cv.accentColor} + '; padding-bottom: 16px; margin-bottom: 16px;'">
            <h1 style="margin: 0; color: #1f2937;" th:text="${cv.title}"></h1>
            <p style="margin: 8px 0 0 0; color: #6b7280; font-size: 18px;" th:text="${cv.professionalTitle}"></p>
        </div>

        <!-- Nội dung Tóm tắt -->
        <div>
            <h3 style="color: #374151; margin-bottom: 8px; font-size: 16px;">Tóm tắt bản thân</h3>
            <p style="color: #4b5563; line-height: 1.6; white-space: pre-wrap;" th:text="${cv.summary != null && !cv.summary.isEmpty() ? cv.summary : 'Chưa có thông tin tóm tắt.'}"></p>
        </div>

        <!-- Footer thông tin phụ -->
        <div style="margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 13px; color: #9ca3af; display: flex; justify-content: space-between;">
            <div>
                <p style="margin: 4px 0;">Mẫu CV: <b th:text="${cv.templateVersion?.template?.name != null ? cv.templateVersion.template.name : 'Mặc định'}"></b></p>
            </div>
            <div style="text-align: right;">
                <p style="margin: 4px 0;">Cập nhật lần cuối: <span th:text="${#temporals.format(cv.updatedAt, 'dd/MM/yyyy HH:mm')}"></span></p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
