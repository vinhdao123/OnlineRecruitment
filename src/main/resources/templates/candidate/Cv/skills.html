<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Kỹ năng — Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
</head>
<body>
<div style="position: relative; z-index: 1000; width: 100%;">
    <div th:replace="~{fragments/taskbar :: taskbar('cvs')}"></div>
</div>

<div class="cv-dashboard-layout">
    <aside class="cv-sidebar">
        <div class="cv-sidebar-menu">
            <a th:href="@{/candidate/cvs}" class="cv-sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                CV của tôi
            </a>
            <a th:href="@{/candidate/cv-templates}" class="cv-sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Hồ sơ mẫu
            </a>
        </div>
    </aside>

    <main class="cv-main-content">
        <div class="cv-page-header">
            <div>
                <h2 class="cv-page-title">Kỹ năng chuyên môn</h2>
                <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Đang chỉnh sửa cho CV: <b th:text="${cv.title}"></b></p>
            </div>
            <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" class="cv-btn-link">&larr; Quay lại chi tiết CV</a>
        </div>

        <div th:if="${successMessage}" class="cv-alert cv-alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="cv-alert cv-alert-danger" th:text="${errorMessage}"></div>

        <div class="cv-form-container">
            <h3 class="cv-form-title">Thêm kỹ năng mới</h3>
            <form th:action="@{/candidate/cvs/{id}/skills/add(id=${cv.id})}" th:object="${skillRequest}" method="post">
                <div class="cv-form-grid">
                    <div class="cv-form-group">
                        <label class="cv-form-label">Chọn kỹ năng (*)</label>
                        <select th:field="*{skillId}" class="cv-form-control">
                            <option value="">-- Chọn kỹ năng --</option>
                            <option th:each="s : ${allSkills}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Mức độ thành thạo (*)</label>
                        <select th:field="*{proficiency}" class="cv-form-control">
                            <option value="">-- Chọn mức độ --</option>
                            <option value="BEGINNER">Beginner (Mới bắt đầu)</option>
                            <option value="INTERMEDIATE">Intermediate (Trung cấp)</option>
                            <option value="ADVANCED">Advanced (Nâng cao)</option>
                            <option value="EXPERT">Expert (Chuyên gia)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="cv-btn-submit">Thêm kỹ năng</button>
            </form>
        </div>

        <h3 class="cv-section-title">Danh sách kỹ năng</h3>
        <div th:if="${cvSkills.isEmpty()}" class="cv-empty-text">Chưa có kỹ năng nào.</div>
        <div th:each="cs : ${cvSkills}" class="cv-item-card" style="align-items: center;">
            <div>
                <h4 class="cv-item-title" th:text="${cs.skill != null ? cs.skill.name : 'Kỹ năng không xác định'}"></h4>
                <p class="cv-item-subtitle" style="margin-top: 4px;">Mức độ: <b th:text="${cs.proficiency}"></b></p>
            </div>
            <form th:action="@{/candidate/cvs/{id}/skills/{skillId}/delete(id=${cv.id}, skillId=${cs.id.skillId})}" method="post" onsubmit="return confirm('Xóa kỹ năng này?');">
                <button type="submit" class="cv-btn-delete">Xóa</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
