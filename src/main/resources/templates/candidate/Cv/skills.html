<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kỹ năng - <span th:text="${cv.title}"></span></title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="header">
    <div class="container header-container">
        <a th:href="@{/}" class="logo">Online<span>Recruitment</span></a>
        <nav class="nav">
            <a th:href="@{/candidate/cvs}" class="active">Quay lại danh sách CV</a>
        </nav>
    </div>
</header>

<main class="container" style="padding: 40px 20px; max-width: 900px; margin: 0 auto;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Kỹ năng chuyên môn</h2>
        <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" style="color: #2563EB; text-decoration: none;">&larr; Quay lại chi tiết CV</a>
    </div>
    <p style="color: #6b7280; margin-bottom: 24px;">Đang chỉnh sửa cho CV: <b th:text="${cv.title}"></b></p>

    <!-- Thông báo -->
    <div th:if="${successMessage}" style="color: #065f46; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; margin-bottom: 15px;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" style="color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; margin-bottom: 15px;" th:text="${errorMessage}"></div>

    <!-- Form thêm mới -->
    <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 30px;">
        <h3 style="margin-top: 0; font-size: 16px;">Thêm kỹ năng</h3>
        <form th:action="@{/candidate/cvs/{id}/skills/add(id=${cv.id})}" th:object="${skillRequest}" method="post">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Chọn kỹ năng (*)</label>
                    <select th:field="*{skillId}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                        <option value="">-- Chọn kỹ năng --</option>
                        <option th:each="s : ${allSkills}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('skillId')}" th:errors="*{skillId}" style="color:red; font-size:12px;"></span>
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Mức độ thành thạo (*)</label>
                    <select th:field="*{proficiency}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                        <option value="">-- Chọn mức độ --</option>
                        <option value="BEGINNER">Beginner (Mới bắt đầu)</option>
                        <option value="INTERMEDIATE">Intermediate (Trung cấp)</option>
                        <option value="ADVANCED">Advanced (Nâng cao)</option>
                        <option value="EXPERT">Expert (Chuyên gia)</option>
                    </select>
                    <span th:if="${#fields.hasErrors('proficiency')}" th:errors="*{proficiency}" style="color:red; font-size:12px;"></span>
                </div>
            </div>

            <button type="submit" style="padding: 8px 16px; background: #2563EB; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">Thêm</button>
        </form>
    </div>

    <!-- Danh sách đã có -->
    <h3 style="margin-top: 0; font-size: 16px;">Danh sách kỹ năng</h3>
    <div th:if="${cvSkills.isEmpty()}" style="color: #6b7280; font-style: italic; padding: 10px 0;">Chưa có kỹ năng nào.</div>

    <div th:each="cs : ${cvSkills}" style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 12px; background: white; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h4 style="margin: 0; font-size: 16px; color: #1f2937;" th:text="${cs.skill != null ? cs.skill.name : 'Kỹ năng không xác định'}"></h4>
            <p style="margin: 4px 0; font-size: 14px; color: #4b5563;">
                Mức độ: <span style="font-weight: 600;" th:text="${cs.proficiency}"></span>
            </p>
        </div>
        <form th:action="@{/candidate/cvs/{id}/skills/{skillId}/delete(id=${cv.id}, skillId=${cs.id.skillId})}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa kỹ năng này?');">
            <button type="submit" style="padding: 6px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">Xóa</button>
        </form>
    </div>
</main>
</body>
</html>
