<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xem trước CV - <span th:text="${cv.title}"></span></title>
    <!-- Sử dụng font chữ đẹp hơn cho CV -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            color: #374151;
        }
        /* Khung giấy A4 */
        .cv-container {
            background-color: white;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        /* Thanh công cụ nổi */
        .toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-primary { background: #2563EB; color: white; }
        .btn-secondary { background: #f3f4f6; color: #374151; }

        /* Nội dung CV */
        .cv-header {
            padding: 40px;
            border-bottom: 3px solid; /* Màu sẽ gán bằng inline style */
        }
        .cv-title { font-size: 32px; font-weight: 700; margin: 0 0 8px 0; color: #111827; }
        .cv-subtitle { font-size: 18px; font-weight: 500; margin: 0; color: #4b5563; }

        .cv-body { padding: 40px; }

        .section { margin-bottom: 30px; }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
            /* Màu chữ section title sẽ gán bằng inline style */
        }

        .item { margin-bottom: 20px; }
        .item:last-child { margin-bottom: 0; }
        .item-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .item-title { font-size: 16px; font-weight: 600; color: #111827; margin: 0; }
        .item-subtitle { font-size: 15px; font-weight: 500; color: #374151; margin: 0; }
        .item-date { font-size: 13px; color: #6b7280; font-weight: 500; white-space: nowrap; }
        .item-desc { font-size: 14px; color: #4b5563; margin-top: 8px; line-height: 1.5; white-space: pre-wrap; }

        /* Kỹ năng dạng tag */
        .skills-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .skill-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            background-color: #f3f4f6;
            color: #374151;
            border: 1px solid #e5e7eb;
        }
        .skill-level { font-size: 12px; font-weight: 400; color: #6b7280; margin-left: 4px;}
    </style>
</head>
<body>

<!-- Thanh công cụ (Không bị in ra khi in PDF) -->
<div class="toolbar">
    <button onclick="window.print()" class="btn btn-primary">In / Lưu PDF</button>
    <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" class="btn btn-secondary">Quay lại</a>
</div>

<div class="cv-container">

    <!-- Header: Tên và chức danh -->
    <div class="cv-header" th:style="'border-color: ' + ${cv.accentColor}">
        <h1 class="cv-title" th:text="${cv.title}"></h1>
        <p class="cv-subtitle" th:text="${cv.professionalTitle}"></p>
    </div>

    <div class="cv-body">

        <!-- Tóm tắt -->
        <div class="section" th:if="${cv.summary != null && !cv.summary.isEmpty()}">
            <h2 class="section-title" th:style="'color: ' + ${cv.accentColor}">Giới thiệu bản thân</h2>
            <p class="item-desc" th:text="${cv.summary}"></p>
        </div>

        <!-- Kinh nghiệm làm việc -->
        <div class="section" th:if="${not #lists.isEmpty(works)}">
            <h2 class="section-title" th:style="'color: ' + ${cv.accentColor}">Kinh nghiệm làm việc</h2>
            <div class="item" th:each="work : ${works}">
                <div class="item-header">
                    <div>
                        <h3 class="item-title" th:text="${work.jobTitle}"></h3>
                        <p class="item-subtitle" th:text="${work.companyName}"></p>
                    </div>
                    <span class="item-date">
                            <span th:text="${work.startDate != null ? #temporals.format(work.startDate, 'MM/yyyy') : ''}"></span> -
                            <span th:text="${work.isCurrent ? 'Hiện tại' : (work.endDate != null ? #temporals.format(work.endDate, 'MM/yyyy') : '')}"></span>
                        </span>
                </div>
                <p class="item-desc" th:if="${work.description != null && !work.description.isEmpty()}" th:text="${work.description}"></p>
            </div>
        </div>

        <!-- Học vấn -->
        <div class="section" th:if="${not #lists.isEmpty(educations)}">
            <h2 class="section-title" th:style="'color: ' + ${cv.accentColor}">Học vấn</h2>
            <div class="item" th:each="edu : ${educations}">
                <div class="item-header">
                    <div>
                        <h3 class="item-title" th:text="${edu.institution}"></h3>
                        <p class="item-subtitle">
                            <span th:text="${edu.degree}"></span>
                            <span th:if="${edu.fieldOfStudy != null}" th:text="' - ' + ${edu.fieldOfStudy}"></span>
                        </p>
                    </div>
                    <span class="item-date">
                            <span th:text="${edu.startDate != null ? #temporals.format(edu.startDate, 'MM/yyyy') : ''}"></span> -
                            <span th:text="${edu.endDate != null ? #temporals.format(edu.endDate, 'MM/yyyy') : 'Hiện tại'}"></span>
                        </span>
                </div>
                <p class="item-desc" th:if="${edu.grade != null && !edu.grade.isEmpty()}" th:text="'Xếp loại: ' + ${edu.grade}"></p>
            </div>
        </div>

        <!-- Dự án -->
        <div class="section" th:if="${not #lists.isEmpty(projects)}">
            <h2 class="section-title" th:style="'color: ' + ${cv.accentColor}">Dự án tiêu biểu</h2>
            <div class="item" th:each="proj : ${projects}">
                <div class="item-header">
                    <div>
                        <h3 class="item-title">
                            <span th:text="${proj.name}"></span>
                            <a th:if="${proj.projectUrl != null && !proj.projectUrl.isEmpty()}" th:href="${proj.projectUrl}" target="_blank" style="font-size: 13px; color: #2563EB; text-decoration: none;">(Xem chi tiết)</a>
                        </h3>
                        <p class="item-subtitle" th:if="${proj.role != null}" th:text="${proj.role}"></p>
                    </div>
                    <span class="item-date">
                            <span th:text="${proj.startDate != null ? #temporals.format(proj.startDate, 'MM/yyyy') : ''}"></span> -
                            <span th:text="${proj.endDate != null ? #temporals.format(proj.endDate, 'MM/yyyy') : 'Hiện tại'}"></span>
                        </span>
                </div>
                <p class="item-desc" th:if="${proj.technologies != null && !proj.technologies.isEmpty()}" style="font-weight: 500; color: #2563EB;" th:text="'Công nghệ: ' + ${proj.technologies}"></p>
                <p class="item-desc" th:if="${proj.description != null && !proj.description.isEmpty()}" th:text="${proj.description}"></p>
            </div>
        </div>

        <!-- Kỹ năng -->
        <div class="section" th:if="${not #lists.isEmpty(skills)}">
            <h2 class="section-title" th:style="'color: ' + ${cv.accentColor}">Kỹ năng chuyên môn</h2>
            <div class="skills-list">
                <div class="skill-tag" th:each="cs : ${skills}">
                    <span th:text="${cs.skill != null ? cs.skill.name : 'Kỹ năng'}"></span>
                    <span class="skill-level" th:text="'(' + ${cs.proficiency} + ')'"></span>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
