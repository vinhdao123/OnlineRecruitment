<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Học vấn - <span th:text="${cv.title}"></span></title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="header">
    <div class="container header-container">
        <a th:href="@{/}" class="logo">Online<span>Recruitment</span></a>
        <nav class="nav">
            <a th:href="@{/candidate/cvs}" class="active">Quay lại danh sách CV</a>
        </nav>
    </div>
</header>

<main class="container" style="padding: 40px 20px; max-width: 900px; margin: 0 auto;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Học vấn</h2>
        <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" style="color: #2563EB; text-decoration: none;">&larr; Quay lại chi tiết CV</a>
    </div>
    <p style="color: #6b7280; margin-bottom: 24px;">Đang chỉnh sửa cho CV: <b th:text="${cv.title}"></b></p>

    <!-- Thông báo -->
    <div th:if="${successMessage}" style="color: #065f46; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; margin-bottom: 15px;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" style="color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; margin-bottom: 15px;" th:text="${errorMessage}"></div>

    <!-- Form thêm mới -->
    <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 30px;">
        <h3 style="margin-top: 0; font-size: 16px;">Thêm học vấn mới</h3>
        <form th:action="@{/candidate/cvs/{id}/educations/add(id=${cv.id})}" th:object="${eduRequest}" method="post">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div style="grid-column: span 2;">
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Tên trường / Tổ chức (*)</label>
                    <input type="text" th:field="*{institution}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                    <span th:if="${#fields.hasErrors('institution')}" th:errors="*{institution}" style="color:red; font-size:12px;"></span>
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Bằng cấp</label>
                    <input type="text" th:field="*{degree}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Chuyên ngành</label>
                    <input type="text" th:field="*{fieldOfStudy}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Ngày bắt đầu</label>
                    <input type="date" th:field="*{startDate}" th:attr="max=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Ngày kết thúc</label>
                    <input type="date" th:field="*{endDate}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Xếp loại</label>
                    <select th:field="*{academicRank}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                        <option value="">-- Chọn xếp loại --</option>
                        <option value="Trung bình">Trung bình</option>
                        <option value="Khá">Khá</option>
                        <option value="Giỏi">Giỏi</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">GPA (Hệ 4.0)</label>
                    <input type="number" step="0.01" min="0" max="4.0" th:field="*{gpa}" placeholder="VD: 3.2" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                    <span th:if="${#fields.hasErrors('gpa')}" th:errors="*{gpa}" style="color:red; font-size:12px;"></span>
                </div>
            </div>

            <div style="margin-bottom: 16px;">
                <label style="font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px;">Mô tả chi tiết</label>
                <textarea th:field="*{description}" rows="3" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;"></textarea>
            </div>

            <button type="submit" style="padding: 8px 16px; background: #2563EB; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">Thêm</button>
        </form>
    </div>

    <!-- Danh sách đã có -->
    <h3 style="margin-top: 0; font-size: 16px;">Danh sách học vấn</h3>
    <div th:if="${educations.isEmpty()}" style="color: #6b7280; font-style: italic; padding: 10px 0;">Chưa có thông tin học vấn nào.</div>

    <div th:each="edu : ${educations}" style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 12px; background: white; display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h4 style="margin: 0; font-size: 16px; color: #1f2937;" th:text="${edu.institution}"></h4>
            <p style="margin: 4px 0; font-weight: 500; color: #4b5563;">
                <span th:text="${edu.degree}"></span> <span th:if="${edu.fieldOfStudy != null && !edu.fieldOfStudy.isEmpty()}" th:text="' - ' + ${edu.fieldOfStudy}"></span>
            </p>
            <p style="margin: 4px 0; font-size: 13px; color: #6b7280;">
                <span th:text="${edu.startDate != null ? #temporals.format(edu.startDate, 'MM/yyyy') : ''}"></span> -
                <span th:text="${edu.endDate != null ? #temporals.format(edu.endDate, 'MM/yyyy') : 'Hiện tại'}"></span>
                <span th:if="${edu.grade != null && !edu.grade.isEmpty()}" th:text="' | ' + ${edu.grade}" style="font-weight: 500;"></span>
            </p>
            <p style="margin: 8px 0 0 0; font-size: 14px; color: #374151; white-space: pre-wrap;" th:text="${edu.description}"></p>
        </div>
        <form th:action="@{/candidate/cvs/{id}/educations/{eduId}/delete(id=${cv.id}, eduId=${edu.id})}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa học vấn này?');">
            <button type="submit" style="padding: 6px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">Xóa</button>
        </form>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const startDate = document.querySelector('input[name="startDate"]');
        const endDate = document.querySelector('input[name="endDate"]');

        if (endDate) {
            endDate.addEventListener('change', function() {
                if (startDate.value && this.value && startDate.value > this.value) {
                    alert('Ngày kết thúc không được nhỏ hơn ngày bắt đầu!');
                    this.value = '';
                }
            });
        }
    });
</script>
</body>
</html>
