<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Học vấn — Online Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Gọi CSS của nhóm -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <!-- Gọi CSS của chúng ta (Đường dẫn mới) -->
    <link rel="stylesheet" th:href="@{/css/Candidate/cv-dashboard.css}">
</head>
<body>
<!-- Gọi Taskbar -->
<div style="position: relative; z-index: 1000; width: 100%;">
    <div th:replace="~{fragments/taskbar :: taskbar('cvs')}"></div>
</div>

<div class="cv-dashboard-layout">
    <aside class="cv-sidebar">
        <div class="cv-sidebar-menu">
            <a th:href="@{/candidate/cvs}" class="cv-sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                CV của tôi
            </a>
            <a th:href="@{/candidate/cv-templates}" class="cv-sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Hồ sơ mẫu
            </a>
        </div>
    </aside>

    <main class="cv-main-content">
        <div class="cv-page-header">
            <div>
                <h2 class="cv-page-title">Học vấn</h2>
                <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Đang chỉnh sửa cho CV: <b th:text="${cv.title}"></b></p>
            </div>
            <a th:href="@{/candidate/cvs/{id}(id=${cv.id})}" class="cv-btn-link">&larr; Quay lại chi tiết CV</a>
        </div>

        <div th:if="${successMessage}" class="cv-alert cv-alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="cv-alert cv-alert-danger" th:text="${errorMessage}"></div>

        <div class="cv-form-container">
            <h3 class="cv-form-title">Thêm học vấn mới</h3>
            <form th:action="@{/candidate/cvs/{id}/educations/add(id=${cv.id})}" th:object="${eduRequest}" method="post">
                <div class="cv-form-grid">
                    <div class="cv-form-group full-width">
                        <label class="cv-form-label">Tên trường / Tổ chức (*)</label>
                        <input type="text" th:field="*{institution}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Bằng cấp</label>
                        <input type="text" th:field="*{degree}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Chuyên ngành</label>
                        <input type="text" th:field="*{fieldOfStudy}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Ngày bắt đầu</label>
                        <input type="date" th:field="*{startDate}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Ngày kết thúc</label>
                        <input type="date" th:field="*{endDate}" class="cv-form-control">
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">Xếp loại</label>
                        <select th:field="*{academicRank}" class="cv-form-control">
                            <option value="">-- Chọn xếp loại --</option>
                            <option value="Trung bình">Trung bình</option>
                            <option value="Khá">Khá</option>
                            <option value="Giỏi">Giỏi</option>
                        </select>
                    </div>
                    <div class="cv-form-group">
                        <label class="cv-form-label">GPA (Hệ 4.0)</label>
                        <input type="number" step="0.01" min="0" max="4.0" th:field="*{gpa}" class="cv-form-control" placeholder="VD: 3.2">
                    </div>
                    <div class="cv-form-group full-width">
                        <label class="cv-form-label">Mô tả chi tiết</label>
                        <textarea th:field="*{description}" class="cv-form-control" rows="3"></textarea>
                    </div>
                </div>
                <button type="submit" class="cv-btn-submit">Thêm học vấn</button>
            </form>
        </div>

        <h3 class="cv-section-title">Danh sách học vấn</h3>
        <div th:if="${educations.isEmpty()}" class="cv-empty-text">Chưa có thông tin học vấn nào.</div>
        <div th:each="edu : ${educations}" class="cv-item-card">
            <div>
                <h4 class="cv-item-title" th:text="${edu.institution}"></h4>
                <p class="cv-item-subtitle">
                    <span th:text="${edu.degree}"></span> <span th:if="${edu.fieldOfStudy != null}" th:text="' - ' + ${edu.fieldOfStudy}"></span>
                </p>
                <p class="cv-item-meta">
                    <span th:text="${edu.startDate != null ? #temporals.format(edu.startDate, 'MM/yyyy') : ''}"></span> -
                    <span th:text="${edu.endDate != null ? #temporals.format(edu.endDate, 'MM/yyyy') : 'Hiện tại'}"></span>
                    <span th:if="${edu.grade != null}" th:text="' | ' + ${edu.grade}" class="cv-bold"></span>
                </p>
                <p class="cv-item-desc" th:text="${edu.description}"></p>
            </div>
            <form th:action="@{/candidate/cvs/{id}/educations/{eduId}/delete(id=${cv.id}, eduId=${edu.id})}" method="post" onsubmit="return confirm('Xóa học vấn này?');">
                <button type="submit" class="cv-btn-delete">Xóa</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
