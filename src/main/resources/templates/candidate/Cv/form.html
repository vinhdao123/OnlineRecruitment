<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Chỉnh sửa CV — Online Recruitment' : 'Tạo CV mới — Online Recruitment'"></title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ================= CSS CHO TASKBAR & LAYOUT ================= */
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            color: #1e293b;
        }
        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1200px; margin: 0 auto; padding: 0 20px;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1f2937; font-weight: 700; font-size: 20px; }
        .logo-icon { background: #2563EB; color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .nav { display: flex; gap: 24px; font-weight: 500; font-size: 15px; }
        .nav a { color: #4b5563; text-decoration: none; }
        .nav a:hover, .nav a.active { color: #2563EB; font-weight: 600; }
        .user-menu { display: flex; align-items: center; gap: 12px; }
        .user-avatar { background: #eff6ff; color: #2563EB; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .user-info { display: flex; flex-direction: column; line-height: 1.2; }
        .user-name { font-weight: 600; font-size: 14px; color: #1f2937; }
        .user-role { font-size: 12px; color: #6b7280; }

        /* ================= CSS CHO LAYOUT CHÍNH ================= */
        .dashboard-layout {
            display: flex; max-width: 1200px; margin: 24px auto; padding: 0 20px; gap: 24px; align-items: flex-start;
        }
        .sidebar { width: 260px; flex-shrink: 0; }
        .sidebar-menu { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 12px; }
        .sidebar-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: #475569; text-decoration: none; border-radius: 8px; font-weight: 500; margin-bottom: 4px; white-space: nowrap;
        }
        .sidebar-item.active { background: #eff6ff; color: #2563eb; font-weight: 600; }
        .sidebar-item svg { width: 20px; height: 20px; flex-shrink: 0; }

        .main-content { flex-grow: 1; min-width: 0; background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 32px; }

        /* ================= CSS CHO FORM ================= */
        .form-header { margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .form-title { font-size: 22px; font-weight: 700; margin: 0; color: #0f172a; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #374151; }
        .form-label .text-danger { color: #ef4444; }

        .form-control {
            width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; outline: none;
        }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        textarea.form-control { resize: vertical; min-height: 100px; }

        .color-picker-wrapper { display: flex; align-items: center; gap: 12px; }
        .color-picker-wrapper input[type="color"] {
            width: 50px; height: 40px; padding: 0; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer;
        }

        .error-text { color: #ef4444; font-size: 13px; margin-top: 4px; display: block; }

        .form-actions { display: flex; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #e2e8f0; }
        .btn-save {
            background: #2563eb; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 500;
            border: none; cursor: pointer; font-size: 14px; transition: background 0.2s;
        }
        .btn-save:hover { background: #1d4ed8; }
        .btn-cancel {
            background: white; color: #374151; padding: 10px 24px; border-radius: 8px; font-weight: 500;
            border: 1px solid #d1d5db; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block;
        }
        .btn-cancel:hover { background: #f3f4f6; }
    </style>
</head>
<body>

<!-- 1. TASKBAR -->
<header class="header">
    <div class="header-container">
        <a th:href="@{/}" class="logo">
            <div class="logo-icon">OR</div>
            Online Recruitment
        </a>
        <nav class="nav">
            <a th:href="@{/}">Trang chủ</a>
            <a th:href="@{/jobs}">Tìm việc làm</a>
            <a th:href="@{/candidate/dashboard}">Bảng điều khiển</a>
            <a th:href="@{/candidate/profile}">Hồ sơ của tôi</a>
            <a th:href="@{/candidate/cvs}" class="active">CV</a>
        </nav>
        <div class="user-menu">
            <div class="user-avatar" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">C</div>
            <div class="user-info">
                <span class="user-name" th:text="${#authentication.name}">candidate</span>
                <span class="user-role">ỨNG VIÊN</span>
            </div>
        </div>
    </div>
</header>

<!-- 2. LAYOUT CHÍNH -->
<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-menu">
            <a th:href="@{/candidate/cvs}" class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                CV của tôi
            </a>
            <a th:href="@{/candidate/cv-templates}" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Hồ sơ mẫu
            </a>
        </div>
    </aside>

    <!-- FORM NỘI DUNG -->
    <main class="main-content">
        <div class="form-header">
            <h2 class="form-title" th:text="${isEdit} ? 'Chỉnh sửa thông tin CV' : 'Tạo CV mới'"></h2>
        </div>

        <div th:if="${errorMessage}" style="background: #fef2f2; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #fecaca; font-size: 14px;" th:text="${errorMessage}"></div>

        <form th:action="${isEdit} ? @{/candidate/cvs/{id}/update(id=${cvId})} : @{/candidate/cvs/create}"
              th:object="${cvRequest}" method="post">

            <!-- Chọn Template (Chỉ hiện khi Tạo mới) -->
            <div class="form-group" th:if="${!isEdit}">
                <label class="form-label">Mẫu CV <span class="text-danger">*</span></label>
                <select th:field="*{templateVersionId}" class="form-control">
                    <option value="">-- Chọn mẫu CV --</option>
                    <option th:each="t : ${templates}" th:value="${t.id}"
                            th:text="${t.templateName + ' (Phiên bản ' + t.versionNumber + ')'}"></option>
                </select>
                <span th:if="${#fields.hasErrors('templateVersionId')}" th:errors="*{templateVersionId}" class="error-text"></span>
            </div>

            <!-- Tiêu đề -->
            <div class="form-group">
                <label class="form-label">Tiêu đề CV <span class="text-danger">*</span></label>
                <input type="text" th:field="*{title}" class="form-control" placeholder="VD: CV Java Developer">
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-text"></span>
            </div>

            <!-- Chức danh -->
            <div class="form-group">
                <label class="form-label">Chức danh nghề nghiệp</label>
                <input type="text" th:field="*{professionalTitle}" class="form-control" placeholder="VD: Backend Developer">
                <span th:if="${#fields.hasErrors('professionalTitle')}" th:errors="*{professionalTitle}" class="error-text"></span>
            </div>

            <!-- Tóm tắt -->
            <div class="form-group">
                <label class="form-label">Tóm tắt bản thân</label>
                <textarea th:field="*{summary}" class="form-control" placeholder="Mô tả ngắn gọn về kinh nghiệm, kỹ năng và mục tiêu nghề nghiệp của bạn..."></textarea>
                <span th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}" class="error-text"></span>
            </div>

            <!-- Màu chủ đạo -->
            <div class="form-group">
                <label class="form-label">Màu chủ đạo CV</label>
                <div class="color-picker-wrapper">
                    <input type="color" th:field="*{accentColor}">
                    <span style="font-size: 14px; color: #64748b;">Chọn màu sắc yêu thích cho CV của bạn.</span>
                </div>
                <span th:if="${#fields.hasErrors('accentColor')}" th:errors="*{accentColor}" class="error-text"></span>
            </div>

            <!-- Nút Hành động -->
            <div class="form-actions">
                <button type="submit" class="btn-save">
                    <span th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo CV'"></span>
                </button>
                <!-- Nút Hủy sẽ quay về trang Chi tiết (nếu Sửa) hoặc Danh sách (nếu Tạo) -->
                <a th:href="${isEdit} ? @{/candidate/cvs/{id}(id=${cvId})} : @{/candidate/cvs}" class="btn-cancel">Hủy bỏ</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
