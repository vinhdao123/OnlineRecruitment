<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa CV' : 'Tạo CV mới'"></title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="header">
    <div class="container header-container">
        <a th:href="@{/}" class="logo">Online<span>Recruitment</span></a>
        <nav class="nav">
            <a th:href="@{/candidate/dashboard}">Dashboard</a>
            <a th:href="@{/candidate/cvs}" class="active">CV của tôi</a>
        </nav>
    </div>
</header>

<main class="container" style="padding: 40px 20px; max-width: 800px; margin: 0 auto;">
    <h2 th:text="${isEdit} ? 'Chỉnh sửa CV' : 'Tạo CV mới'"></h2>

    <div th:if="${errorMessage}" style="color: red; margin-bottom: 15px;" th:text="${errorMessage}"></div>

    <form th:action="${isEdit} ? @{/candidate/cvs/{id}/update(id=${cvId})} : @{/candidate/cvs/create}"
          th:object="${cvRequest}" method="post" style="background: white; padding: 24px; border-radius: 8px; border: 1px solid #e5e7eb;">

        <!-- Chọn template (chỉ hiện khi Tạo mới) -->
        <div th:if="${!isEdit}" style="margin-bottom: 16px;">
            <label style="font-weight: 600; display: block; margin-bottom: 6px;">Mẫu CV</label>
            <select th:field="*{templateVersionId}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                <option value="">-- Chọn mẫu --</option>
                <option th:each="t : ${templates}" th:value="${t.id}"
                        th:text="${t.templateName + ' (v' + t.versionNumber + ')'}"></option>
            </select>
            <span th:if="${#fields.hasErrors('templateVersionId')}" th:errors="*{templateVersionId}" style="color:red; font-size:13px;"></span>
        </div>

        <div style="margin-bottom: 16px;">
            <label style="font-weight: 600; display: block; margin-bottom: 6px;">Tiêu đề CV (*)</label>
            <input type="text" th:field="*{title}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
            <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red; font-size:13px;"></span>
        </div>

        <div style="margin-bottom: 16px;">
            <label style="font-weight: 600; display: block; margin-bottom: 6px;">Chức danh</label>
            <input type="text" th:field="*{professionalTitle}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 16px;">
            <label style="font-weight: 600; display: block; margin-bottom: 6px;">Tóm tắt</label>
            <textarea th:field="*{summary}" rows="4" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;"></textarea>
        </div>

        <div style="margin-bottom: 24px;">
            <label style="font-weight: 600; display: block; margin-bottom: 6px;">Màu chủ đạo</label>
            <input type="color" th:field="*{accentColor}" style="padding: 2px; height: 40px; width: 80px;">
            <span th:if="${#fields.hasErrors('accentColor')}" th:errors="*{accentColor}" style="color:red; font-size:13px;"></span>
        </div>

        <div style="display: flex; gap: 12px;">
            <button type="submit" style="padding: 10px 20px; background: #2563EB; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                Lưu CV
            </button>
            <a th:href="@{/candidate/cvs}" style="padding: 10px 20px; background: #f3f4f6; color: #374151; border-radius: 6px; text-decoration: none; font-weight: 500;">Hủy</a>
        </div>
    </form>
</main>
</body>
</html>
