<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thay đổi mật khẩu — Ứng viên | OnlineRecruitment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/ui-polish.css}">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

<!-- Navigation -->
<div th:replace="~{fragments/taskbar :: taskbar('profile')}"></div>

<main class="max-w-xl mx-auto px-4 py-12 flex-1 w-full flex items-center justify-center">

    <div class="w-full bg-white rounded-3xl p-8 sm:p-10 border border-slate-200/80 shadow-xl shadow-slate-200/50">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-4 shadow-sm">
                <i data-lucide="shield" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-display font-extrabold text-slate-900 tracking-tight">
                Đổi Mật Khẩu Tài Khoản
            </h1>
            <p class="text-xs text-slate-500 mt-1.5 leading-relaxed max-w-sm mx-auto">
                Bảo vệ tài khoản bằng việc xác thực qua mã OTP Gmail trước khi thiết lập mật khẩu mới.
            </p>
        </div>

        <!-- Alerts -->
        <div th:if="${successMessage}"
             class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-medium flex items-center gap-3">
            <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600 shrink-0"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}"
             class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-medium flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 shrink-0"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- BƯỚC 1: GỬI OTP -->
        <form th:action="@{/candidate/change-password/send-otp}" method="post" class="mb-6 pb-6 border-b border-slate-100">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Gmail tài khoản của bạn <span class="text-rose-500">*</span>
                </label>
                <div class="flex gap-2">
                    <input type="email" name="email" required
                           th:value="${inputEmail != null ? inputEmail : accountUser.email}"
                           placeholder="Nhập email tài khoản"
                           class="flex-1 px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
                    <button type="submit"
                            class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md shadow-blue-600/20 transition-all shrink-0 flex items-center gap-1.5">
                        <i data-lucide="send" class="w-3.5 h-3.5"></i>
                        <span>Gửi OTP</span>
                    </button>
                </div>
                <small class="text-[11px] text-slate-400 mt-1 block">Hệ thống sẽ gửi mã xác thực 6 số về Gmail này.</small>
            </div>
        </form>

        <!-- BƯỚC 2: XÁC THỰC VÀ ĐỔI MẬT KHẨU -->
        <form th:action="@{/candidate/change-password}" method="post" class="space-y-4">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="email" th:value="${inputEmail != null ? inputEmail : accountUser.email}">

            <!-- OTP Input -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Mã xác thực OTP (6 chữ số) <span class="text-rose-500">*</span>
                </label>
                <input type="text" name="otp" maxlength="6" required
                       th:value="${inputOtp != null ? inputOtp : ''}"
                       placeholder="••••••"
                       class="w-full px-4 py-2.5 text-center font-mono tracking-widest text-lg font-bold rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
            </div>

            <!-- New Password -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Mật khẩu mới <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <input type="password" id="newPass" name="newPassword" minlength="6" required
                           placeholder="••••••••"
                           class="w-full pl-4 pr-12 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
                    <button type="button" onclick="togglePass('newPass')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-slate-600">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm New Password -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Xác nhận mật khẩu mới <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <input type="password" id="confirmPass" name="confirmPassword" minlength="6" required
                           placeholder="••••••••"
                           class="w-full pl-4 pr-12 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
                    <button type="button" onclick="togglePass('confirmPass')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-slate-600">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-600/30 transition-all flex items-center justify-center gap-2 mt-6">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>Xác Nhận Đổi Mật Khẩu</span>
            </button>

            <div class="text-center pt-4 border-t border-slate-100">
                <a th:href="@{/candidate/profile}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Quay lại trang hồ sơ cá nhân
                </a>
            </div>
        </form>
    </div>
</main>

<!-- Shared Modern Footer -->
<footer th:replace="~{fragments/taskbar :: taskbarFooter}"></footer>

<script>
    lucide.createIcons();

    function togglePass(id) {
        const input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>
</body>
</html>
