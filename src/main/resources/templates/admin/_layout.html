<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Online Recruitment Admin'">Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin">

<!-- ==================== SIDEBAR FRAGMENT ==================== -->
<aside class="sidebar" th:fragment="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">OR</div>
        <div>
            <div class="logo-text">RecruitAdmin</div>
            <div class="logo-sub">Pro</div>
        </div>
    </div>

    <nav>
        <!-- ========== MENU CHÍNH ========== -->

        <a th:href="@{/admin/dashboard}"
           class="nav-item"
           th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
            <span class="icon">📊</span>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/admin/users}"
           class="nav-item"
           th:classappend="${activeMenu == 'users'} ? 'active' : ''">
            <span class="icon">👥</span>
            <span>Users</span>
        </a>

        <a th:href="@{/admin/packages}"
           class="nav-item"
           th:classappend="${activeMenu == 'packages'} ? 'active' : ''">
            <span class="icon">💳</span>
            <span>Gói dịch vụ</span>
        </a>

        <!-- MENU CHA có submenu: Companies -->
        <details class="nav-group" th:attr="open=${activeMenu == 'companies' or activeMenu == 'pending' or activeMenu == 'banned'} ? 'open' : null">
            <summary class="nav-item nav-parent">
                <span class="icon">🏢</span>
                <span>Companies</span>
                <span class="chevron">›</span>
            </summary>
            <div class="nav-submenu">
                <a th:href="@{/admin/companies}"
                   class="nav-sub-item"
                   th:classappend="${activeMenu == 'companies'} ? 'active' : ''">
                    Tất cả công ty
                </a>
                <a th:href="@{/admin/companies?status=PENDING}"
                   class="nav-sub-item"
                   th:classappend="${activeMenu == 'pending'} ? 'active' : ''">
                    Chờ duyệt
                </a>
                <a th:href="@{/admin/companies?status=LOCKED}"
                   class="nav-sub-item"
                   th:classappend="${activeMenu == 'banned'} ? 'active' : ''">
                    Đã khóa
                </a>
            </div>
        </details>

        <!-- MENU CHA có submenu: Jobs (nếu có) -->
        <details class="nav-group" th:attr="open=${activeMenu == 'jobs'} ? 'open' : null">
            <summary class="nav-item nav-parent">
                <span class="icon">💼</span>
                <span>Jobs</span>
                <span class="chevron">›</span>
            </summary>
            <div class="nav-submenu">
                <a href="#" class="nav-sub-item">Tất cả job</a>
                <a href="#" class="nav-sub-item">Chờ duyệt</a>
                <a href="#" class="nav-sub-item">Đã đóng</a>
            </div>
        </details>

        <div class="nav-section">SYSTEM</div>

        <a href="#" class="nav-item">
            <span class="icon">⚙️</span>
            <span>Settings</span>
        </a>

        <form th:action="@{/logout}" method="post" style="margin:0; padding:0;">
            <button type="submit" class="nav-item" style="width:100%; text-align:left; background:none; border:none; cursor:pointer; font:inherit; color:inherit;">
                <span class="icon">🚪</span>
                <span>Đăng xuất</span>
            </button>
        </form>
    </nav>
</aside>

<!-- ==================== TOPBAR FRAGMENT ==================== -->
<div class="topbar" th:fragment="topbar(title, subtitle)">
    <div class="topbar-title">
        <span th:text="${title}">Title</span>
        <small th:if="${subtitle != null}" th:text="${subtitle}"></small>
    </div>
    <div class="topbar-actions">
        <div class="search-global">
            <input type="text" placeholder="Search candidates, companies..." maxlength="100">
        </div>
        <!-- User dropdown -->
        <div class="user-dropdown" id="userDropdown">
            <button type="button" class="topbar-user" onclick="toggleUserMenu(event)">
                <div class="avatar-circle">
                    <span th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</span>
                </div>
                <span th:text="${#authentication.name}">admin</span>
                <span style="font-size:10px; opacity:0.6;">▼</span>
            </button>

            <div class="dropdown-menu" id="userMenu">
                <div class="dropdown-header">
                    <div class="avatar-circle" style="width:36px; height:36px; font-size:14px;">
                        <span th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</span>
                    </div>
                    <div>
                        <div style="font-weight:600; font-size:13px;"
                             th:text="${#authentication.name}">admin</div>
                        <div style="font-size:11px; color:#8895a8;"
                             th:text="${#authentication.authorities[0].authority}">ROLE_ADMIN</div>
                    </div>
                </div>

                <a href="#" class="dropdown-item">
                    <span>⚙</span> Settings
                </a>

                <a href="#" class="dropdown-item">
                    <span>👤</span> Profile
                </a>

                <div class="dropdown-divider"></div>

                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="dropdown-item dropdown-item-danger">
                        <span>🚪</span> Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:fragment="scripts">
    function toggleUserMenu(event) {
        event.stopPropagation();
        const menu = document.getElementById('userMenu');
        if (menu) menu.classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
        const menu = document.getElementById('userMenu');
        const dropdown = document.getElementById('userDropdown');
        if (dropdown && menu && !dropdown.contains(e.target)) {
            menu.classList.remove('open');
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const menu = document.getElementById('userMenu');
            if (menu) menu.classList.remove('open');
        }
    });
</script>

</body>
</html>
