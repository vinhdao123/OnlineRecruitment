<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head(${question.id == null ? 'Thêm câu hỏi mới' : 'Chỉnh sửa câu hỏi'})}"></head>
<body class="admin bg-slate-50 text-slate-800 font-sans min-h-screen flex antialiased">

<aside th:replace="~{admin/_layout :: sidebar}"></aside>

<div class="main flex-1 flex flex-col min-w-0 min-h-screen">

  <div th:replace="~{admin/_layout :: topbar(${question.id == null ? 'Thêm câu hỏi phỏng vấn mới' : 'Chỉnh sửa câu hỏi phỏng vấn'}, 'Cung cấp ý đồ phỏng vấn và câu trả lời mẫu cho ứng viên')}"></div>

  <div class="p-6 sm:p-8 space-y-6 flex-1 max-w-4xl w-full mx-auto">

    <!-- Breadcrumb -->
    <div class="flex items-center justify-between text-xs text-slate-500 font-medium">
      <div class="flex items-center gap-2">
        <a th:href="@{/admin/interview-questions}" class="hover:text-primary-600">Cẩm nang phỏng vấn</a>
        <span>/</span>
        <span class="text-primary-600 font-semibold" th:text="${question.id == null ? 'Thêm mới' : 'Chỉnh sửa'}">Biểu mẫu</span>
      </div>
      <a th:href="@{/admin/interview-questions}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-primary-600">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        Quay lại danh sách
      </a>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-10 shadow-sm space-y-8">
      <div class="flex items-center gap-4 pb-6 border-b border-slate-100">
        <div class="w-12 h-12 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center font-bold text-xl flex-shrink-0">
          <i data-lucide="help-circle" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 font-display"
              th:text="${question.id == null ? 'Thêm câu hỏi phỏng vấn mới' : 'Chỉnh sửa câu hỏi phỏng vấn'}">
            Câu hỏi phỏng vấn
          </h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Biên soạn cẩm nang chuẩn bị phỏng vấn, dàn ý STAR và câu trả lời tham khảo.</p>
        </div>
      </div>

      <form th:action="${question.id == null} ? @{/admin/interview-questions/create} : @{'/admin/interview-questions/' + ${question.id} + '/edit'}"
            th:object="${question}" method="post" class="space-y-6">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700">Tiêu đề câu hỏi phỏng vấn <span class="text-rose-500">*</span></label>
          <input type="text" th:field="*{question}" required
                 placeholder="VD: Hãy giới thiệu ngắn gọn về bản thân bạn? / Bạn giải quyết bất đồng với đồng nghiệp thế nào?"
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700">Chủ đề / Nhóm câu hỏi <span class="text-rose-500">*</span></label>
            <input type="text" th:field="*{category}" required list="catList"
                   placeholder="VD: Phỏng vấn chung, Tình huống, Kỹ thuật..."
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
            <datalist id="catList">
              <option value="Phỏng vấn chung">
              <option value="Tình huống & Hành vi">
              <option value="Kỹ thuật / IT">
              <option value="Đàm phán lương">
              <option value="Định hướng nghề nghiệp">
              <option value="Kỹ năng mềm">
            </datalist>
          </div>

          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700">Cấp độ áp dụng</label>
            <select th:field="*{targetLevel}"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
              <option value="Mọi cấp bậc">Mọi cấp bậc</option>
              <option value="Fresher / Thực tập sinh">Fresher / Thực tập sinh</option>
              <option value="Junior / Middle">Junior / Middle</option>
              <option value="Senior / Lead">Senior / Lead</option>
            </select>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700">Ý đồ của nhà tuyển dụng khi hỏi câu này</label>
          <textarea th:field="*{purpose}" rows="2"
                    placeholder="Giải thích vì sao HR hỏi câu này và họ kỳ vọng đo lường năng lực hoặc thái độ gì..."
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm"></textarea>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700">Gợi ý &amp; Dàn ý cấu trúc trả lời (Ví dụ: mô hình STAR)</label>
          <textarea th:field="*{tips}" rows="3"
                    placeholder="Hướng dẫn ứng viên sắp xếp ý theo mô hình STAR (Situation, Task, Action, Result)..."
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm"></textarea>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700">Câu trả lời mẫu ấn tượng</label>
          <textarea th:field="*{sampleAnswer}" rows="4"
                    placeholder="Đoạn văn mẫu minh họa cách trả lời tự tin, chân thật và đúng trọng tâm..."
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm"></textarea>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700">Những lỗi sai phổ biến nên tránh</label>
          <textarea th:field="*{pitfalls}" rows="2"
                    placeholder="Những câu trả lời vòng vo, thiếu số liệu hoặc làm mất điểm với HR..."
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700">Thứ tự sắp xếp hiển thị</label>
            <input type="number" th:field="*{displayOrder}"
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
          </div>

          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700">Trạng thái phát hành</label>
            <select th:field="*{status}"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
              <option value="ACTIVE">ACTIVE — Hiển thị công khai</option>
              <option value="HIDDEN">HIDDEN — Tạm ẩn</option>
            </select>
          </div>
        </div>

        <div class="pt-6 border-t border-slate-100 flex items-center justify-end gap-3">
          <a th:href="@{/admin/interview-questions}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-xs transition-all">
            Hủy bỏ
          </a>
          <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-sm transition-all">
            <i data-lucide="save" class="w-4 h-4"></i>
            Lưu câu hỏi phỏng vấn
          </button>
        </div>
      </form>
    </div>

  </div>
</div>

<th:block th:replace="~{admin/_layout :: scripts}"></th:block>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });
</script>
</body>
</html>
