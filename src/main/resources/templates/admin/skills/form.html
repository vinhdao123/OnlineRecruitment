<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head(${pageTitle})}"></head>
<body class="admin bg-slate-50 text-slate-800 font-sans min-h-screen flex antialiased">

<aside th:replace="~{admin/_layout :: sidebar}"></aside>

<div class="main flex-1 flex flex-col min-w-0 min-h-screen">

    <div th:replace="~{admin/_layout :: topbar('Quản lý kỹ năng', 'Tạo mới hoặc chỉnh sửa thẻ kỹ năng chuyên môn')}"></div>

    <div class="p-6 sm:p-8 space-y-6 flex-1 max-w-3xl w-full mx-auto">

        <!-- Breadcrumb -->
        <div class="flex items-center justify-between text-xs text-slate-500 font-medium">
            <div class="flex items-center gap-2">
                <a th:href="@{/admin/skills}" class="hover:text-primary-600">Quản lý kỹ năng</a>
                <span>/</span>
                <span class="text-primary-600 font-semibold" th:text="${pageTitle}">Biểu mẫu</span>
            </div>
            <a th:href="@{/admin/skills}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-primary-600">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                Quay lại danh sách
            </a>
        </div>

        <!-- Alert Error -->
        <div th:if="${errorMessage}" class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-medium flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 flex-shrink-0"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-10 shadow-sm space-y-6">
            <div class="flex items-center gap-4 pb-6 border-b border-slate-100">
                <div class="w-12 h-12 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center font-bold text-xl flex-shrink-0">
                    <i data-lucide="zap" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 font-display" th:text="${pageTitle}">Kỹ năng chuyên môn</h1>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Đặt tên kỹ năng rõ ràng và gắn vào đúng ngành nghề chuyên ngành.</p>
                </div>
            </div>

            <form th:object="${skillForm}" th:action="${skillId == null} ? @{/admin/skills} : @{/admin/skills/{id}(id=${skillId})}" method="post" class="space-y-6">

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">Tên kỹ năng chuyên môn <span class="text-rose-500">*</span></label>
                    <input type="text" th:field="*{name}" maxlength="150" required
                           placeholder="Ví dụ: Java, Python, Figma, ReactJS, Kỹ năng đàm phán B2B..."
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-rose-500 font-medium"></span>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">Thuộc danh mục ngành nghề <span class="text-rose-500">*</span></label>
                    <select th:field="*{categoryId}" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                        <option value="">-- Chọn danh mục ngành nghề --</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name + ' (' + c.status + ')'}"
                                th:disabled="${c.status != 'ACTIVE' and (skillForm.categoryId == null or skillForm.categoryId != c.id)}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-xs text-rose-500 font-medium"></span>
                </div>

                <div th:if="${skillId != null}" class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">Trạng thái sử dụng</label>
                    <select th:field="*{status}"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                        <option value="ACTIVE">ACTIVE — Đang sử dụng</option>
                        <option value="INACTIVE">INACTIVE — Ngừng sử dụng</option>
                    </select>
                </div>

                <div class="p-4 rounded-2xl bg-amber-50/70 border border-amber-200/80 text-xs text-amber-900 leading-relaxed flex items-start gap-2.5">
                    <i data-lucide="info" class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5"></i>
                    <div>
                        Tên kỹ năng là duy nhất trong toàn bộ hệ thống. Kỹ năng đã từng liên kết trong tin tuyển dụng sẽ không thể chuyển đổi danh mục ngành nghề.
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 flex items-center justify-end gap-3">
                    <a th:href="@{/admin/skills}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-xs transition-all">
                        Hủy bỏ
                    </a>
                    <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-sm transition-all">
                        <i data-lucide="save" class="w-4 h-4"></i>
                        Lưu kỹ năng
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

<th:block th:replace="~{admin/_layout :: scripts}"></th:block>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.lucide) {
            window.lucide.createIcons();
        }
    });
</script>
</body>
</html>
