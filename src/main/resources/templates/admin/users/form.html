<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Tạo tài khoản mới')}"></head>
<body class="admin bg-slate-50 text-slate-800 font-sans min-h-screen flex antialiased">

<aside th:replace="~{admin/_layout :: sidebar}"></aside>

<div class="main flex-1 flex flex-col min-w-0 min-h-screen">

    <div th:replace="~{admin/_layout :: topbar('Thêm tài khoản mới', 'Khởi tạo tài khoản Quản trị viên, Nhà tuyển dụng hoặc Ứng viên')}"></div>

    <div class="p-6 sm:p-8 space-y-6 flex-1 max-w-4xl w-full mx-auto">

        <!-- Breadcrumb -->
        <div class="flex items-center justify-between text-xs text-slate-500 font-medium">
            <div class="flex items-center gap-2">
                <a th:href="@{/admin/users}" class="hover:text-primary-600">Quản lý tài khoản</a>
                <span>/</span>
                <span class="text-primary-600 font-semibold">Tạo tài khoản</span>
            </div>
            <a th:href="@{/admin/users}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-primary-600">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                Quay lại danh sách
            </a>
        </div>

        <!-- Alert Error -->
        <div th:if="${error}" class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-medium flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 flex-shrink-0"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Main Form Card -->
        <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-10 shadow-sm space-y-8">
            <div class="flex items-center gap-4 pb-6 border-b border-slate-100">
                <div class="w-12 h-12 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center font-bold text-xl flex-shrink-0">
                    <i data-lucide="user-plus" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 font-display">Tạo tài khoản người dùng mới</h1>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Điền đầy đủ thông tin định danh và phân quyền truy cập hệ thống.</p>
                </div>
            </div>

            <form th:action="@{/admin/users/new}" method="post" class="space-y-8">

                <!-- Section 1: Thông tin đăng nhập -->
                <div class="space-y-4">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="lock" class="w-4 h-4 text-primary-600"></i>
                        Thông tin đăng nhập &amp; Phân quyền
                    </h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-700">Tên đăng nhập (Username) <span class="text-rose-500">*</span></label>
                            <input type="text" name="username" required maxlength="100"
                                   pattern="[a-zA-Z0-9_]{3,50}" title="Chỉ chữ, số và gạch dưới, 3-50 ký tự"
                                   placeholder="vd: nguyenvana"
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-700">Địa chỉ Email <span class="text-rose-500">*</span></label>
                            <input type="email" name="email" required maxlength="255"
                                   placeholder="vd: user@example.com"
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                        </div>

                        <div class="space-y-1.5 sm:col-span-2">
                            <label class="text-xs font-bold text-slate-700">Mật khẩu khởi tạo <span class="text-rose-500">*</span></label>
                            <input type="password" name="password" required minlength="6" maxlength="100"
                                   placeholder="Tối thiểu 6 ký tự..."
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-700">Vai trò hệ thống <span class="text-rose-500">*</span></label>
                            <select name="role" required
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                                <option value="">-- Chọn vai trò --</option>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-700">Trạng thái tài khoản <span class="text-rose-500">*</span></label>
                            <select name="status" required
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                                <option th:each="s : ${statuses}" th:if="${s.name() != 'INACTIVE'}"
                                        th:value="${s}" th:text="${s}" th:selected="${s.name() == 'ACTIVE'}"></option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Thông tin cá nhân -->
                <div class="space-y-4 pt-4 border-t border-slate-100">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="user" class="w-4 h-4 text-primary-600"></i>
                        Thông tin cá nhân người dùng
                    </h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="space-y-1.5 sm:col-span-2">
                            <label class="text-xs font-bold text-slate-700">Họ và tên đầy đủ <span class="text-rose-500">*</span></label>
                            <input type="text" name="fullName" required maxlength="150"
                                   placeholder="vd: Nguyễn Văn A"
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-700">Số điện thoại</label>
                            <input type="text" name="phone" maxlength="11" pattern="[0-9]{10,11}"
                                   title="Số điện thoại chỉ gồm 10 chữ số" placeholder="0901 234 567"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-700">Tỉnh / Thành phố</label>
                            <input type="text" name="location" maxlength="255" placeholder="Hà Nội, TP. Hồ Chí Minh..."
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                        </div>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 flex items-center justify-end gap-3">
                    <a th:href="@{/admin/users}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-xs transition-all">
                        Hủy bỏ
                    </a>
                    <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-sm transition-all">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        Khởi tạo tài khoản
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

<th:block th:replace="~{admin/_layout :: scripts}"></th:block>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.lucide) {
            window.lucide.createIcons();
        }
    });
</script>
</body>
</html>
