<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Edit User')}"></head>
<body class="admin">

<aside th:replace="~{admin/_layout :: sidebar}"></aside>

<div class="main">

    <div class="topbar">
        <div>
            <div class="breadcrumb">
                <a th:href="@{/admin/users}">Accounts</a>
                <span>›</span>
                <a th:href="@{'/admin/users/' + ${user.id}}" th:text="${user.fullName}">User</a>
                <span>›</span>
                <b>Edit</b>
            </div>
        </div>
        <div class="topbar-actions">
            <div class="search-global">
                <input type="text" placeholder="Search candidates, companies..." maxlength="100">
            </div>
            <div class="topbar-user">
                <div class="avatar-circle">
                    <span th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</span>
                </div>
                <span th:text="${#authentication.name}">admin</span>
            </div>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="section">
        <div class="section-header">
            <div>
                <div class="section-title">✏ Chỉnh sửa tài khoản</div>
                <div class="section-sub">
                    Cập nhật thông tin cho tài khoản
                    <b th:text="${user.username}">user</b>
                </div>
            </div>
        </div>

        <form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" method="post">

            <h3 style="font-size: 14px; color: #4a5568; margin: 16px 0 12px;
                       text-transform: uppercase; letter-spacing: 0.5px;">
                🔐 Thông tin tài khoản
            </h3>

            <div class="info-grid">
                <div>
                    <label style="display:block; font-size:13px; font-weight:600;
                                  color:#4a5568; margin-bottom:6px;">
                        Username (không đổi được)
                    </label>
                    <input type="text" th:value="${user.username}" disabled
                           style="width:100%; padding:10px; border:1px solid #d5dde8;
                                  border-radius:8px; font-size:14px;
                                  background:#f7f9fc; color:#8895a8;">

                    <label style="display:block; font-size:13px; font-weight:600;
                                  color:#4a5568; margin:14px 0 6px;">
                        Email <span style="color:#d33;">*</span>
                    </label>
                    <input type="email" name="email" required maxlength="255"
                           th:value="${user.email}"
                           style="width:100%; padding:10px; border:1px solid #d5dde8;
                                  border-radius:8px; font-size:14px;">

                    <label style="display:block; font-size:13px; font-weight:600;
                                  color:#4a5568; margin:14px 0 6px;">
                        Họ tên <span style="color:#d33;">*</span>
                    </label>
                    <input type="text" name="fullName" required maxlength="150"
                           th:value="${user.fullName}"
                           style="width:100%; padding:10px; border:1px solid #d5dde8;
                                  border-radius:8px; font-size:14px;">
                </div>

                <div>
                    <label style="display:block; font-size:13px; font-weight:600;
                                  color:#4a5568; margin-bottom:6px;">
                        Vai trò <span style="color:#d33;">*</span>
                    </label>
                    <select name="role" required
                            style="width:100%; padding:10px; border:1px solid #d5dde8;
                                   border-radius:8px; font-size:14px;">
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r}"
                                th:selected="${user.role.name() == r.name()}"></option>
                    </select>

                    <label style="display:block; font-size:13px; font-weight:600;
                                  color:#4a5568; margin:14px 0 6px;">
                        Trạng thái <span style="color:#d33;">*</span>
                    </label>
                    <select name="status" required
                            style="width:100%; padding:10px; border:1px solid #d5dde8;
                                   border-radius:8px; font-size:14px;">
                        <option th:each="s : ${statuses}"
                                th:if="${s.name() != 'INACTIVE'}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${user.status.name() == s.name()}"></option>
                    </select>

                    <label style="display:block; font-size:13px; font-weight:600;
                                  color:#4a5568; margin:14px 0 6px;">
                        Số điện thoại
                    </label>
                    <input type="text" name="phone" maxlength="11"
                           pattern="[0-9]{10,11}"
                           title="Số điện thoại chỉ gồm 10 chữ số"
                           placeholder="vd: 0901234567"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                           style="width:100%; padding:10px; border:1px solid #d5dde8;
                           border-radius:8px; font-size:14px;">

                    <label style="display:block; font-size:13px; font-weight:600;
                                  color:#4a5568; margin:14px 0 6px;">
                        Địa điểm
                    </label>
                    <input type="text" name="location" maxlength="255"
                           th:value="${user.location}"
                           style="width:100%; padding:10px; border:1px solid #d5dde8;
                                  border-radius:8px; font-size:14px;">
                </div>
            </div>

            <div style="display:flex; gap:12px; margin-top:32px; padding-top:20px;
                        border-top:1px solid #eef1f6;">
                <button type="submit" class="btn btn-primary">
                    ✓ Cập nhật
                </button>
                <a th:href="@{'/admin/users/' + ${user.id}}" class="btn btn-secondary">
                    Hủy
                </a>
            </div>

        </form>
    </div>

</div>

<th:block th:replace="~{admin/_layout :: scripts}"></th:block>

</body>
</html>
