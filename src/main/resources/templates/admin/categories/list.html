
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Categories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f7fb;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #edf2f7;
        }

        .btn {
            display: inline-block;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }

        .message {
            padding: 10px;
            margin: 12px 0;
            background: #e5f7e9;
            color: #166534;
            border-radius: 5px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Job Categories</h1>

    <div class="message"
         th:if="${successMessage}"
         th:text="${successMessage}"></div>

    <div class="message error"
         th:if="${errorMessage}"
         th:text="${errorMessage}"></div>

    <a class="btn" th:href="@{/admin/categories/new}">
        + Create Job Category
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Status</th>
            <th>Created At</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td th:text="${category.description ?: '-'}"></td>
            <td th:text="${category.status}"></td>
            <td th:text="${category.createdAt}"></td>
            <td>
                <a class="btn"
                   th:href="@{/admin/categories/{id}/edit(id=${category.id})}">
                    Edit
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="6">No job categories found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
