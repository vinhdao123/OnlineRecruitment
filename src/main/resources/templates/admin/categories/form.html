<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head(${pageTitle})}"></head>
<body class="admin bg-slate-50 text-slate-800 font-sans min-h-screen flex antialiased">

<aside th:replace="~{admin/_layout :: sidebar}"></aside>

<div class="main flex-1 flex flex-col min-w-0 min-h-screen">

    <div th:replace="~{admin/_layout :: topbar('Danh mục ngành nghề', 'Tạo mới hoặc cập nhật thông tin ngành nghề tuyển dụng')}"></div>

    <div class="p-6 sm:p-8 space-y-6 flex-1 max-w-3xl w-full mx-auto">

        <!-- Breadcrumb -->
        <div class="flex items-center justify-between text-xs text-slate-500 font-medium">
            <div class="flex items-center gap-2">
                <a th:href="@{/admin/categories}" class="hover:text-primary-600">Danh mục việc làm</a>
                <span>/</span>
                <span class="text-primary-600 font-semibold" th:text="${pageTitle}">Biểu mẫu</span>
            </div>
            <a th:href="@{/admin/categories}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-primary-600">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                Quay lại danh sách
            </a>
        </div>

        <!-- Alert Error -->
        <div th:if="${errorMessage}" class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-medium flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 flex-shrink-0"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-10 shadow-sm space-y-6">
            <div class="flex items-center gap-4 pb-6 border-b border-slate-100">
                <div class="w-12 h-12 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center font-bold text-xl flex-shrink-0">
                    <i data-lucide="folder-plus" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 font-display" th:text="${pageTitle}">Danh mục ngành nghề</h1>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Điền tên ngành nghề và mô tả chi tiết để phân loại việc làm.</p>
                </div>
            </div>

            <form th:object="${categoryForm}" th:action="${categoryId == null} ? @{/admin/categories} : @{/admin/categories/{id}(id=${categoryId})}" method="post" class="space-y-6">

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">Tên danh mục ngành nghề <span class="text-rose-500">*</span></label>
                    <input type="text" th:field="*{name}" maxlength="150" required
                           placeholder="Ví dụ: Công nghệ thông tin, Marketing / Truyền thông, Tài chính / Ngân hàng..."
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-rose-500 font-medium"></span>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">Mô tả danh mục</label>
                    <textarea th:field="*{description}" rows="3" placeholder="Nhập định nghĩa hoặc các vị trí tiêu biểu thuộc danh mục này..."
                              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm"></textarea>
                </div>

                <div th:if="${categoryId != null}" class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">Trạng thái sử dụng</label>
                    <select th:field="*{status}"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                        <option value="ACTIVE">ACTIVE — Cho phép đăng tin tuyển dụng mới</option>
                        <option value="INACTIVE">INACTIVE — Ngừng cho phép chọn ngành này</option>
                    </select>
                    <p class="text-[11px] text-slate-400">Các tin cũ đã đăng vẫn giữ nguyên danh mục này, nhưng nhà tuyển dụng không thể chọn danh mục này cho tin mới.</p>
                </div>

                <div class="pt-6 border-t border-slate-100 flex items-center justify-end gap-3">
                    <a th:href="@{/admin/categories}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-xs transition-all">
                        Hủy bỏ
                    </a>
                    <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-sm transition-all">
                        <i data-lucide="save" class="w-4 h-4"></i>
                        Lưu danh mục
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

<th:block th:replace="~{admin/_layout :: scripts}"></th:block>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.lucide) {
            window.lucide.createIcons();
        }
    });
</script>
</body>
</html>
