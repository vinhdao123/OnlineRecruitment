<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Quản lý Đề thi đánh giá kỹ năng')}"></head>
<body class="admin">

<aside th:replace="~{admin/_layout :: sidebar}"></aside>

<div class="main">

  <div th:replace="~{admin/_layout :: topbar('Quản lý Đề thi đánh giá kỹ năng', 'Cấu hình bộ đề thi trắc nghiệm và ngân hàng câu hỏi (Question Pool)')}"></div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <form method="get" th:action="@{/admin/skill-tests}" class="filters" style="margin:0; flex:1;">
      <input type="text" name="keyword" class="grow"
             placeholder="Tìm kiếm theo tên đề thi, kỹ năng..." maxlength="100"
             th:value="${keyword}">

      <select name="category">
        <option value="">Tất cả danh mục</option>
        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"
                th:selected="${selectedCategory == cat}"></option>
      </select>

      <button type="submit" class="btn btn-primary">Lọc</button>
      <a th:href="@{/admin/skill-tests}" class="btn btn-secondary">Đặt lại</a>
    </form>

    <a th:href="@{/admin/skill-tests/create}" class="btn btn-primary" style="margin-left:16px; white-space:nowrap;">
      + Tạo bộ đề thi mới
    </a>
  </div>

  <p style="font-size: 13px; color: #8895a8; margin-bottom: 12px;">
    Hiển thị <b th:text="${tests.size()}">0</b> trên tổng số <b th:text="${totalItems}">0</b> đề thi
  </p>

  <div class="table-wrap">
    <table class="data">
      <thead>
      <tr>
        <th>Tên đề thi</th>
        <th>Kỹ năng</th>
        <th>Thời gian</th>
        <th>Cấu hình Random</th>
        <th>Lượt thi</th>
        <th>Trạng thái</th>
        <th style="width: 240px; text-align:right;">Thao tác</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="t : ${tests}">
        <td>
          <b th:text="${t.title}">Đề thi Java</b>
          <div style="font-size:12px; color:#8895a8;" th:text="${t.category}">Kỹ năng công nghệ</div>
        </td>
        <td>
          <span class="badge"
                th:style="'background:' + (${t.badgeColor != null ? t.badgeColor : '#2563eb'}) + '; color:#fff; font-weight:700;'"
                th:text="${t.skillName}">Java</span>
        </td>
        <td th:text="${t.durationMinutes + ' phút'}">15 phút</td>
        <td>
          <b style="color:#00b14f;" th:text="${t.totalQuestionsPerTest}">10</b> câu / bài thi
          <div style="font-size:12px; color:#8895a8;">
            (Ngân hàng: <span th:text="${t.questionPool != null ? t.questionPool.size() : 0}">0</span> câu)
          </div>
        </td>
        <td th:text="${t.participantCount != null ? t.participantCount : 0}">1400</td>
        <td>
          <span class="badge" th:classappend="${t.status == 'ACTIVE'} ? 'badge-active' : 'badge-banned'"
                th:text="${t.status}">ACTIVE</span>
        </td>
        <td style="text-align:right; white-space:nowrap;">
          <a th:href="@{'/admin/skill-tests/' + ${t.id} + '/questions'}" class="btn btn-primary" style="font-size:12px; padding:4px 8px; background:#00b14f; border-color:#00b14f;">
            📌 Ngân hàng câu hỏi
          </a>
          <a th:href="@{'/admin/skill-tests/' + ${t.id} + '/edit'}" class="btn btn-secondary" style="font-size:12px; padding:4px 8px;">
            Sửa
          </a>
          <form th:action="@{'/admin/skill-tests/' + ${t.id} + '/delete'}" method="post" style="display:inline;"
                onsubmit="return confirm('Bạn có chắc muốn xóa bộ đề thi này?')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-danger" style="font-size:12px; padding:4px 8px;">
              Xóa
            </button>
          </form>
        </td>
      </tr>
      <tr th:if="${tests.isEmpty()}">
        <td colspan="7" style="text-align:center; color:#8895a8; padding: 40px;">
          Chưa có đề thi kỹ năng nào.
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 0}"
       th:href="@{/admin/skill-tests(page=${currentPage - 1}, keyword=${keyword}, category=${selectedCategory})}"
       class="page-link">‹ Trước</a>

    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <a th:href="@{/admin/skill-tests(page=${i}, keyword=${keyword}, category=${selectedCategory})}"
         class="page-link"
         th:classappend="${i == currentPage} ? 'active' : ''"
         th:text="${i + 1}">1</a>
    </span>

    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/admin/skill-tests(page=${currentPage + 1}, keyword=${keyword}, category=${selectedCategory})}"
       class="page-link">Sau ›</a>
  </div>

</div>

<th:block th:replace="~{admin/_layout :: scripts}"></th:block>
</body>
</html>
