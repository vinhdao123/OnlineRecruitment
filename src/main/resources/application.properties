
spring.application.name=OnlineRecruitment

# ===============================
# DATABASE - SQL SERVER
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=OnlineRecruitment;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# EMAIL
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# JPA / HIBERNATE
# ===============================

# TU DONG CAP NHAT DATABASE THEO ENTITY JAVA
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# ===============================
# APPLICATION
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# PROFILE
# ===============================
spring.profiles.active=local
