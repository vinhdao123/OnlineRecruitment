<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Recruiter - Online Recruitment</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div class="auth-header">
    <a href="/" class="logo">
        <span class="logo-icon">OR</span>
        <span>Online Recruitment</span>
    </a>
</div>

<div class="auth-card extra-wide-card">
    <h1 class="auth-title">Đăng Ký Recruiter</h1>
    <p class="auth-subtitle">
        Đăng ký tài khoản doanh nghiệp để tìm kiếm và tuyển dụng nhân tài
    </p>

    <!-- Thông báo lỗi -->
    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/register/recruiter}"
          th:object="${recruiterDto}"
          method="post">

        <!-- SECTION 1: THÔNG TIN NGƯỜI ĐẠI DIỆN -->
        <div class="section-title">
            <span>👤</span> 1. THÔNG TIN NGƯỜI ĐẠI DIỆN
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="username">
                    Tên người dùng (User Name)
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="username"
                       th:field="*{username}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                       placeholder="nguyenvanre">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}">
                </div>
            </div>

            <div class="form-group">
                <label for="email">
                    Email cá nhân / Đăng nhập
                    <span class="required">*</span>
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                       placeholder="example@gmail.com">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="fullName">
                    Họ và tên <span class="required">*</span>
                </label>

                <input type="text"
                       id="fullName"
                       th:field="*{fullName}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                       placeholder="Nguyễn Văn A">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('fullName')}"
                     th:errors="*{fullName}">
                </div>
            </div>

            <div class="form-group">
                <label for="phone">
                    Số điện thoại cá nhân
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="phone"
                       th:field="*{phone}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                       placeholder="0912345678">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('phone')}"
                     th:errors="*{phone}">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">
                    Mật khẩu <span class="required">*</span>
                </label>

                <input type="password"
                       id="password"
                       th:field="*{password}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                       placeholder="Nhập mật khẩu">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Nhập lại mật khẩu <span class="required">*</span>
                </label>

                <input type="password"
                       id="confirmPassword"
                       th:field="*{confirmPassword}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                       placeholder="Xác nhận mật khẩu">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}">
                </div>
            </div>
        </div>

        <!-- SECTION 2: THÔNG TIN CÔNG TY -->
        <div class="section-title">
            <span>🏢</span> 2. THÔNG TIN CÔNG TY
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="companyName">
                    Tên công ty <span class="required">*</span>
                </label>

                <input type="text"
                       id="companyName"
                       th:field="*{companyName}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid' : ''"
                       placeholder="Công ty TNHH ABC">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('companyName')}"
                     th:errors="*{companyName}">
                </div>
            </div>

            <div class="form-group">
                <label for="taxCode">
                    Mã số thuế <span class="required">*</span>
                </label>

                <input type="text"
                       id="taxCode"
                       th:field="*{taxCode}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('taxCode')} ? 'is-invalid' : ''"
                       placeholder="0101234567">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('taxCode')}"
                     th:errors="*{taxCode}">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="companyEmail">
                    Email công ty <span class="required">*</span>
                </label>

                <input type="email"
                       id="companyEmail"
                       th:field="*{companyEmail}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('companyEmail')} ? 'is-invalid' : ''"
                       placeholder="contact@company.com">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('companyEmail')}"
                     th:errors="*{companyEmail}">
                </div>
            </div>

            <div class="form-group">
                <label for="companyPhone">
                    Số điện thoại công ty
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="companyPhone"
                       th:field="*{companyPhone}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('companyPhone')} ? 'is-invalid' : ''"
                       placeholder="0901234567">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('companyPhone')}"
                     th:errors="*{companyPhone}">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="companySize">Quy mô công ty</label>

                <select id="companySize"
                        th:field="*{companySize}"
                        class="form-control">
                    <option value="">-- Chọn quy mô --</option>
                    <option value="Dưới 20 người">Dưới 20 người</option>
                    <option value="20 - 50 người">20 - 50 người</option>
                    <option value="50 - 150 người">50 - 150 người</option>
                    <option value="150 - 500 người">150 - 500 người</option>
                    <option value="Trên 500 người">Trên 500 người</option>
                </select>
            </div>

            <div class="form-group">
                <label for="website">Website công ty</label>

                <input type="url"
                       id="website"
                       th:field="*{website}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('website')} ? 'is-invalid' : ''"
                       placeholder="https://company.com">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('website')}"
                     th:errors="*{website}">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="address">
                Địa chỉ công ty <span class="required">*</span>
            </label>

            <input type="text"
                   id="address"
                   th:field="*{address}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                   placeholder="Tầng, số nhà, đường, tỉnh/thành phố">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('address')}"
                 th:errors="*{address}">
            </div>
        </div>

        <div class="form-group">
            <label for="companyDescription">
                Mô tả công ty (Description)
            </label>

            <textarea id="companyDescription"
                      th:field="*{companyDescription}"
                      rows="3"
                      class="form-control"
                      placeholder="Giới thiệu ngắn gọn về lịch sử, lĩnh vực hoạt động và môi trường làm việc...">
            </textarea>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('companyDescription')}"
                 th:errors="*{companyDescription}">
            </div>
        </div>

        <button type="submit"
                class="btn btn-success"
                style="margin-top: 10px;">
            Đăng Ký Doanh Nghiệp
        </button>

        <div class="auth-footer">
            Đã có tài khoản?
            <a th:href="@{/login}">Đăng nhập ngay</a>
        </div>

        <div class="auth-footer">
            Bạn đang tìm việc?
            <a th:href="@{/register/candidate}">
                Đăng ký Candidate
            </a>
        </div>

    </form>
</div>

</body>
</html>
